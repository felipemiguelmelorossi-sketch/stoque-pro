<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>HBO FLIX</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #141414;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 68px;

    display: flex;
    align-items: center;

    padding: 0 4%;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.95),
            rgba(0,0,0,.5),
            transparent
        );

    z-index: 1000;
}

.logo {
    color: #e50914;
    font-size: 28px;
    font-weight: 900;
    margin-right: 35px;
}

nav {
    display: flex;
    gap: 20px;
}

nav button {
    border: 0;
    background: none;
    color: #ccc;
    cursor: pointer;
    font-size: 14px;
}

nav button:hover {
    color: white;
}

.header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 15px;
}

.search-button {
    width: 38px;
    height: 38px;
    border: 0;
    background: transparent;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.search-icon {
    width: 17px;
    height: 17px;

    border: 2px solid #aaa;
    border-radius: 50%;

    position: relative;
}

.search-icon::after {
    content: "";

    position: absolute;

    width: 8px;
    height: 2px;

    background: #aaa;

    right: -6px;
    bottom: -3px;

    transform: rotate(45deg);
}

.search-button:hover .search-icon {
    border-color: white;
}

.search-button:hover .search-icon::after {
    background: white;
}

.profile-button {
    width: 34px;
    height: 34px;

    border: 0;
    border-radius: 5px;

    background: #333;

    cursor: pointer;
}

.search-box {
    position: fixed;

    top: 70px;
    right: 4%;

    display: none;

    z-index: 1100;
}

.search-box input {
    width: 280px;

    padding: 13px;

    background: #111;

    border: 1px solid #555;

    color: white;

    outline: none;
}

.hero {
    height: 620px;

    display: flex;
    align-items: flex-end;

    padding: 0 5% 90px;

    background:
        linear-gradient(
            to top,
            #141414,
            transparent 60%
        ),
        linear-gradient(
            to right,
            #000,
            transparent
        ),
        url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=2000&q=80");

    background-size: cover;
    background-position: center;
}

.hero-content {
    max-width: 600px;
}

.hero h1 {
    font-size: 55px;
    margin-bottom: 15px;
}

.hero p {
    color: #ccc;
    line-height: 1.6;
    margin-bottom: 20px;
}

.hero-buttons {
    display: flex;
    gap: 10px;
}

.play-button,
.info-button {
    border: 0;
    padding: 12px 23px;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
}

.play-button {
    background: white;
    color: black;
}

.info-button {
    background: #666;
    color: white;
}

main {
    padding: 0 4% 60px;
}

.section {
    margin-bottom: 45px;
}

.section h2 {
    margin-bottom: 16px;
    font-size: 22px;
}

.movies {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(160px, 1fr));

    gap: 15px;
}

.movie-card {
    background: #222;

    border-radius: 5px;

    overflow: hidden;

    cursor: pointer;

    transition: .25s;
}

.movie-card:hover {
    transform: scale(1.04);
}

.poster {
    width: 100%;
    height: 235px;

    object-fit: cover;
}

.poster-placeholder {
    width: 100%;
    height: 235px;

    background:
        linear-gradient(
            135deg,
            #222,
            #444
        );

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 38px;
    color: #777;
}

.movie-info {
    padding: 10px;
}

.movie-title {
    font-size: 14px;
    font-weight: bold;
}

.movie-year {
    margin-top: 5px;
    color: #999;
    font-size: 12px;
}

#searchResults {
    display: none;
}

.no-results {
    color: #aaa;
    padding: 20px 0;
}

.modal {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.8);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 2000;

    padding: 20px;
}

.modal-content {
    width: min(700px, 100%);

    background: #181818;

    border-radius: 8px;

    overflow: hidden;
}

.modal-top {
    height: 250px;

    background:
        linear-gradient(
            to top,
            #181818,
            transparent
        ),
        #333;

    display: flex;
    align-items: flex-end;

    padding: 25px;
}

.modal-title {
    font-size: 30px;
    font-weight: bold;
}

.modal-body {
    padding: 25px;
}

.modal-description {
    color: #ccc;
    line-height: 1.6;
    margin-bottom: 20px;
}

.modal-buttons {
    display: flex;
    gap: 10px;
}

.close-button {
    position: fixed;

    top: 25px;
    right: 30px;

    width: 40px;
    height: 40px;

    border: 0;
    border-radius: 50%;

    background: #333;
    color: white;

    font-size: 22px;

    cursor: pointer;
}

@media(max-width:700px) {

    nav {
        display: none;
    }

    .hero {
        height: 560px;
        padding: 0 20px 60px;
    }

    .hero h1 {
        font-size: 38px;
    }

    main {
        padding: 0 18px 50px;
    }

    .movies {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

}

</style>

</head>

<body>

<header>

    <div class="logo">
        HBO FLIX
    </div>

    <nav>

        <button onclick="mostrarTodos()">
            Início
        </button>

        <button onclick="filtrarTipo('Filme')">
            Filmes
        </button>

        <button onclick="filtrarTipo('Série')">
            Séries
        </button>

        <button onclick="mostrarMinhaLista()">
            Minha lista
        </button>

    </nav>

    <div class="header-right">

        <button
            class="search-button"
            onclick="toggleSearch()"
            title="Pesquisar"
        >
            <span class="search-icon"></span>
        </button>

        <button
            class="profile-button"
            onclick="mostrarPerfil()"
        >
            👤
        </button>

    </div>

</header>


<div
    class="search-box"
    id="searchBox"
>

    <input
        id="searchInput"
        type="text"
        placeholder="Buscar filmes e séries..."
        oninput="pesquisar()"
    >

</div>


<section class="hero">

    <div class="hero-content">

        <h1>
            HBO FLIX
        </h1>

        <p>
            Filmes, séries e entretenimento em um só lugar.
        </p>

        <div class="hero-buttons">

            <button
                class="play-button"
                onclick="abrirFilme(catalogo[0])"
            >
                ▶ Assistir
            </button>

            <button
                class="info-button"
                onclick="abrirFilme(catalogo[0])"
            >
                ⓘ Mais informações
            </button>

        </div>

    </div>

</section>


<main>

    <section class="section">

        <h2>
            Populares
        </h2>

        <div
            class="movies"
            id="popularMovies"
        ></div>

    </section>


    <section class="section">

        <h2>
            Filmes
        </h2>

        <div
            class="movies"
            id="movieList"
        ></div>

    </section>


    <section class="section">

        <h2>
            Séries
        </h2>

        <div
            class="movies"
            id="seriesList"
        ></div>

    </section>


    <section class="section">

        <h2>
            Minha lista
        </h2>

        <div
            class="movies"
            id="myList"
        ></div>

        <div
            id="emptyList"
            class="no-results"
        >
            Sua lista está vazia.
        </div>

    </section>


    <section
        class="section"
        id="searchResults"
    >

        <h2>
            Resultados da busca
        </h2>

        <div
            class="movies"
            id="searchMovies"
        ></div>

        <div
            id="noResults"
            class="no-results"
        >
            Nenhum título encontrado.
        </div>

    </section>

</main>


<div
    class="modal"
    id="movieModal"
>

    <button
        class="close-button"
        onclick="fecharModal()"
    >
        ×
    </button>

    <div class="modal-content">

        <div class="modal-top">

            <div
                class="modal-title"
                id="modalTitle"
            >
            </div>

        </div>

        <div class="modal-body">

            <p
                class="modal-description"
                id="modalDescription"
            >
            </p>

            <div class="modal-buttons">

                <button
                    class="play-button"
                    onclick="assistirSelecionado()"
                >
                    ▶ Assistir
                </button>

                <button
                    class="info-button"
                    onclick="adicionarSelecionado()"
                >
                    ＋ Minha lista
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* ==================================
   VERIFICAR LOGIN
================================== */

const conta =
    localStorage.getItem("hboFlixConta");

if (!conta) {

    window.location.href =
        "index.html";

}


/* ==================================
   CATÁLOGO
================================== */

const catalogo = [

    {
        id: 1,
        titulo: "Horizonte",
        ano: 2026,
        tipo: "Filme",
        descricao: "Um novo começo em um mundo desconhecido.",
        poster: "",
        video: ""
    },

    {
        id: 2,
        titulo: "Código Zero",
        ano: 2026,
        tipo: "Filme",
        descricao: "Uma missão secreta muda tudo.",
        poster: "",
        video: ""
    },

    {
        id: 3,
        titulo: "Além do Tempo",
        ano: 2025,
        tipo: "Filme",
        descricao: "Uma aventura através do tempo.",
        poster: "",
        video: ""
    },

    {
        id: 4,
        titulo: "Distrito 9",
        ano: 2025,
        tipo: "Filme",
        descricao: "Uma cidade dividida por um segredo.",
        poster: "",
        video: ""
    },

    {
        id: 5,
        titulo: "Última Chamada",
        ano: 2025,
        tipo: "Filme",
        descricao: "Uma ligação pode mudar o destino.",
        poster: "",
        video: ""
    },

    {
        id: 6,
        titulo: "A Jornada",
        ano: 2025,
        tipo: "Filme",
        descricao: "Uma viagem inesperada.",
        poster: "",
        video: ""
    },

    {
        id: 7,
        titulo: "Operação Eclipse",
        ano: 2026,
        tipo: "Filme",
        descricao: "Uma operação perigosa começa.",
        poster: "",
        video: ""
    },

    {
        id: 8,
        titulo: "Cidade Sombria",
        ano: 2025,
        tipo: "Série",
        descricao: "Mistérios escondidos nas ruas da cidade.",
        poster: "",
        video: ""
    },

    {
        id: 9,
        titulo: "Depois da Meia-Noite",
        ano: 2025,
        tipo: "Filme",
        descricao: "Nada é o que parece.",
        poster: "",
        video: ""
    },

    {
        id: 10,
        titulo: "O Último Sinal",
        ano: 2026,
        tipo: "Filme",
        descricao: "Um sinal misterioso chega do espaço.",
        poster: "",
        video: ""
    },

    {
        id: 11,
        titulo: "Conexão",
        ano: 2025,
        tipo: "Série",
        descricao: "Pessoas desconhecidas acabam conectadas.",
        poster: "",
        video: ""
    },

    {
        id: 12,
        titulo: "Arquivo 21",
        ano: 2026,
        tipo: "Série",
        descricao: "Um arquivo secreto guarda uma verdade.",
        poster: "",
        video: ""
    },

    {
        id: 13,
        titulo: "Nova Geração",
        ano: 2026,
        tipo: "Série",
        descricao: "Uma nova geração começa.",
        poster: "",
        video: ""
    },

    {
        id: 14,
        titulo: "Linha Vermelha",
        ano: 2025,
        tipo: "Filme",
        descricao: "Cruzar a linha tem consequências.",
        poster: "",
        video: ""
    },

    {
        id: 15,
        titulo: "Segredos",
        ano: 2025,
        tipo: "Série",
        descricao: "Todos escondem alguma coisa.",
        poster: "",
        video: ""
    },

    {
        id: 16,
        titulo: "Ponto Final",
        ano: 2026,
        tipo: "Filme",
        descricao: "Tudo termina em uma última decisão.",
        poster: "",
        video: ""
    }

];


let filmeSelecionado = null;


/* ==================================
   CRIAR CARD
================================== */

function criarCard(filme) {

    const card =
        document.createElement("div");

    card.className =
        "movie-card";

    card.onclick =
        function() {

            abrirFilme(filme);

        };


    let imagem;


    if (filme.poster) {

        imagem = `
            <img
                class="poster"
                src="${filme.poster}"
                alt="${filme.titulo}"
            >
        `;

    } else {

        imagem = `
            <div class="poster-placeholder">
                ▶
            </div>
        `;

    }


    card.innerHTML = `

        ${imagem}

        <div class="movie-info">

            <div class="movie-title">
                ${filme.titulo}
            </div>

            <div class="movie-year">
                ${filme.ano} • ${filme.tipo}
            </div>

        </div>

    `;


    return card;

}


/* ==================================
   CARREGAR CATÁLOGO
================================== */

function carregarCatalogo(lista) {

    const filmes =
        document.getElementById(
            "movieList"
        );

    const series =
        document.getElementById(
            "seriesList"
        );

    const populares =
        document.getElementById(
            "popularMovies"
        );


    filmes.innerHTML = "";
    series.innerHTML = "";
    populares.innerHTML = "";


    lista
        .filter(
            filme => filme.tipo === "Filme"
        )
        .forEach(
            filme =>
                filmes.appendChild(
                    criarCard(filme)
                )
        );


    lista
        .filter(
            filme => filme.tipo === "Série"
        )
        .forEach(
            filme =>
                series.appendChild(
                    criarCard(filme)
                )
        );


    lista
        .slice(0, 6)
        .forEach(
            filme =>
                populares.appendChild(
                    criarCard(filme)
                )
        );

}


/* ==================================
   MINHA LISTA
================================== */

function carregarMinhaLista() {

    const container =
        document.getElementById(
            "myList"
        );

    const empty =
        document.getElementById(
            "emptyList"
        );


    container.innerHTML = "";


    const ids =
        JSON.parse(
            localStorage.getItem(
                "hboFlixMinhaLista"
            ) || "[]"
        );


    const lista =
        catalogo.filter(
            filme => ids.includes(filme.id)
        );


    if (lista.length === 0) {

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    lista.forEach(
        filme =>
            container.appendChild(
                criarCard(filme)
            )
    );

}


/* ==================================
   ABRIR FILME
================================== */

function abrirFilme(filme) {

    filmeSelecionado =
        filme;


    document.getElementById(
        "modalTitle"
    ).textContent =
        filme.titulo;


    document.getElementById(
        "modalDescription"
    ).textContent =
        filme.descricao;


    document.getElementById(
        "movieModal"
    ).style.display =
        "flex";

}


/* ==================================
   FECHAR
================================== */

function fecharModal() {

    document.getElementById(
        "movieModal"
    ).style.display =
        "none";

}


/* ==================================
   ASSISTIR
================================== */

function assistirSelecionado() {

    if (!filmeSelecionado) {
        return;
    }


    if (!filmeSelecionado.video) {

        alert(
            "Este título ainda não possui um vídeo conectado."
        );

        return;

    }


    window.location.href =
        "player.html?id=" +
        filmeSelecionado.id;

}


/* ==================================
   MINHA LISTA
================================== */

function adicionarSelecionado() {

    if (!filmeSelecionado) {
        return;
    }


    let lista =
        JSON.parse(
            localStorage.getItem(
                "hboFlixMinhaLista"
            ) || "[]"
        );


    if (!lista.includes(
        filmeSelecionado.id
    )) {

        lista.push(
            filmeSelecionado.id
        );

        localStorage.setItem(
            "hboFlixMinhaLista",
            JSON.stringify(lista)
        );

        alert(
            "Adicionado à Minha Lista!"
        );

    } else {

        alert(
            "Esse título já está na sua lista."
        );

    }


    carregarMinhaLista();

}


/* ==================================
   PESQUISA
================================== */

function toggleSearch() {

    const box =
        document.getElementById(
            "searchBox"
        );


    if (
        box.style.display === "block"
    ) {

        box.style.display =
            "none";

    } else {

        box.style.display =
            "block";

        document.getElementById(
            "searchInput"
        ).focus();

    }

}


function pesquisar() {

    const texto =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const section =
        document.getElementById(
            "searchResults"
        );

    const container =
        document.getElementById(
            "searchMovies"
        );

    const noResults =
        document.getElementById(
            "noResults"
        );


    if (!texto) {

        section.style.display =
            "none";

        return;

    }


    section.style.display =
        "block";


    const resultados =
        catalogo.filter(
            filme =>
                filme.titulo
                    .toLowerCase()
                    .includes(texto)
        );


    container.innerHTML = "";


    resultados.forEach(
        filme =>
            container.appendChild(
                criarCard(filme)
            )
    );


    noResults.style.display =
        resultados.length === 0
            ? "block"
            : "none";

}


/* ==================================
   FILTRAR
================================== */

function filtrarTipo(tipo) {

    const lista =
        catalogo.filter(
            filme =>
                filme.tipo === tipo
        );


    carregarCatalogo(lista);

    window.scrollTo({
        top: 600,
        behavior: "smooth"
    });

}


function mostrarTodos() {

    carregarCatalogo(catalogo);

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function mostrarMinhaLista() {

    document.getElementById(
        "myList"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


/* ==================================
   PERFIL
================================== */

function mostrarPerfil() {

    const dados =
        JSON.parse(
            localStorage.getItem(
                "hboFlixConta"
            ) || "{}"
        );


    alert(
        "PERFIL\n\n" +
        "Nome: " +
        (dados.nome || "Usuário") +
        "\nE-mail: " +
        (dados.email || "Não informado")
    );

}


/* ==================================
   INICIAR
================================== */

carregarCatalogo(catalogo);

carregarMinhaLista();

</script>

</body>
</html>
