<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HBO FLIX</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #141414;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 68px;

            display: flex;
            align-items: center;

            padding: 0 4%;

            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.95),
                rgba(0,0,0,0.65),
                transparent
            );

            z-index: 1000;
        }

        .logo {
            color: #e50914;
            font-size: 27px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-right: 35px;
        }

        nav {
            display: flex;
            gap: 22px;
        }

        nav button {
            background: none;
            border: none;
            color: #ddd;
            font-size: 14px;
            cursor: pointer;
        }

        nav button:hover {
            color: white;
        }

        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        /* =========================
           BOTÃO DE PESQUISA
        ========================= */

        .search-button {
            width: 38px;
            height: 38px;

            border: none;
            background: transparent;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .search-icon {
            width: 17px;
            height: 17px;

            border: 2px solid #aaa;
            border-radius: 50%;

            position: relative;
            display: block;
        }

        .search-icon::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 2px;

            background: #aaa;

            right: -6px;
            bottom: -3px;

            transform: rotate(45deg);

            border-radius: 2px;
        }

        .search-button:hover .search-icon {
            border-color: white;
        }

        .search-button:hover .search-icon::after {
            background: white;
        }

        /* =========================
           PERFIL
        ========================= */

        .profile-button {
            width: 34px;
            height: 34px;

            border: none;
            border-radius: 5px;

            background: #333;

            color: white;

            cursor: pointer;

            font-size: 15px;
        }

        /* =========================
           PESQUISA
        ========================= */

        .search-box {
            position: fixed;

            top: 68px;
            right: 4%;

            display: none;

            z-index: 1100;
        }

        .search-box input {
            width: 280px;

            padding: 13px 15px;

            background: #111;

            border: 1px solid #555;

            color: white;

            outline: none;

            border-radius: 4px;
        }

        .search-box input:focus {
            border-color: white;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            height: 620px;

            display: flex;
            align-items: flex-end;

            padding: 0 5% 90px;

            position: relative;

            background:
                linear-gradient(
                    to top,
                    #141414 0%,
                    rgba(20,20,20,0.2) 45%,
                    rgba(0,0,0,0.1) 100%
                ),
                linear-gradient(
                    to right,
                    #000 0%,
                    rgba(0,0,0,0.75) 35%,
                    rgba(0,0,0,0.15) 80%
                ),
                url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=2000&q=80");

            background-size: cover;
            background-position: center;
        }

        .hero-content {
            max-width: 620px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .hero-info {
            color: #ddd;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .hero-description {
            color: #ddd;
            line-height: 1.6;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .hero-buttons {
            display: flex;
            gap: 10px;
        }

        .play-button,
        .info-button {
            border: none;

            padding: 12px 24px;

            border-radius: 4px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .play-button {
            background: white;
            color: black;
        }

        .play-button:hover {
            background: #ddd;
        }

        .info-button {
            background: rgba(100,100,100,0.75);
            color: white;
        }

        .info-button:hover {
            background: rgba(120,120,120,0.9);
        }

        /* =========================
           CONTEÚDO
        ========================= */

        main {
            padding: 0 4% 60px;
        }

        .section {
            margin-bottom: 45px;
        }

        .section h2 {
            font-size: 22px;
            margin-bottom: 16px;
        }

        .movies {
            display: grid;

            grid-template-columns: repeat(
                auto-fill,
                minmax(160px, 1fr)
            );

            gap: 15px;
        }

        /* =========================
           CARDS
        ========================= */

        .movie-card {
            background: #222;

            border-radius: 5px;

            overflow: hidden;

            cursor: pointer;

            transition:
                transform 0.25s,
                box-shadow 0.25s;

            min-height: 290px;
        }

        .movie-card:hover {
            transform: scale(1.04);

            box-shadow:
                0 10px 25px rgba(0,0,0,0.6);

            position: relative;
            z-index: 5;
        }

        .poster {
            width: 100%;
            height: 235px;

            object-fit: cover;

            display: block;

            background: #333;
        }

        .poster-placeholder {
            width: 100%;
            height: 235px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #222,
                    #444
                );

            color: #888;

            font-size: 35px;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 14px;
            font-weight: bold;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .movie-year {
            color: #999;

            font-size: 12px;

            margin-top: 5px;
        }

        /* =========================
           RESULTADO DA BUSCA
        ========================= */

        #searchResults {
            display: none;
        }

        .no-results {
            color: #aaa;
            padding: 30px 0;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.78);

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 2000;

            padding: 20px;
        }

        .modal-content {
            width: min(700px, 100%);

            background: #181818;

            border-radius: 7px;

            overflow: hidden;

            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .modal-top {
            height: 260px;

            background:
                linear-gradient(
                    to top,
                    #181818,
                    transparent
                ),
                #333;

            display: flex;
            align-items: flex-end;

            padding: 25px;
        }

        .modal-title {
            font-size: 30px;
            font-weight: bold;
        }

        .modal-body {
            padding: 25px;
        }

        .modal-description {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .close-button {
            position: absolute;

            top: 25px;
            right: 30px;

            width: 40px;
            height: 40px;

            border: none;

            border-radius: 50%;

            background: #222;

            color: white;

            font-size: 20px;

            cursor: pointer;
        }

        .close-button:hover {
            background: #444;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 0 18px;
            }

            .logo {
                font-size: 21px;
                margin-right: 15px;
            }

            nav {
                display: none;
            }

            .hero {
                height: 560px;
                padding: 0 20px 60px;
            }

            .hero h1 {
                font-size: 38px;
            }

            .hero-description {
                font-size: 14px;
            }

            main {
                padding: 0 18px 50px;
            }

            .movies {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .poster,
            .poster-placeholder {
                height: 230px;
            }

            .search-box {
                right: 18px;
            }

            .search-box input {
                width: 230px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         CABEÇALHO
    ========================= -->

    <header>

        <div class="logo">
            HBO FLIX
        </div>

        <nav>
            <button onclick="mostrarTodos()">
                Início
            </button>

            <button onclick="filtrarTipo('Filme')">
                Filmes
            </button>

            <button onclick="filtrarTipo('Série')">
                Séries
            </button>

            <button onclick="mostrarMinhaLista()">
                Minha lista
            </button>
        </nav>

        <div class="header-right">

            <button
                class="search-button"
                onclick="toggleSearch()"
                aria-label="Pesquisar filmes"
                title="Pesquisar"
            >
                <span class="search-icon"></span>
            </button>

            <button
                class="profile-button"
                onclick="mostrarPerfil()"
                title="Perfil"
            >
                👤
            </button>

        </div>

    </header>

    <!-- =========================
         PESQUISA
    ========================= -->

    <div class="search-box" id="searchBox">

        <input
            id="searchInput"
            type="text"
            placeholder="Buscar filmes e séries..."
            oninput="pesquisar()"
        >

    </div>

    <!-- =========================
         DESTAQUE
    ========================= -->

    <section class="hero">

        <div class="hero-content">

            <h1 id="heroTitle">
                HBO FLIX
            </h1>

            <div class="hero-info">
                Filmes • Séries • Entretenimento
            </div>

            <p class="hero-description">
                Assista aos seus filmes e séries favoritos
                em um só lugar.
            </p>

            <div class="hero-buttons">

                <button
                    class="play-button"
                    onclick="abrirDestaque()"
                >
                    ▶ Assistir
                </button>

                <button
                    class="info-button"
                    onclick="abrirDestaque()"
                >
                    ⓘ Mais informações
                </button>

            </div>

        </div>

    </section>

    <!-- =========================
         CONTEÚDO
    ========================= -->

    <main>

        <!-- CONTINUAR -->

        <section class="section">

            <h2>
                Continuar assistindo
            </h2>

            <div
                class="movies"
                id="continueMovies"
            ></div>

        </section>


        <!-- POPULARES -->

        <section class="section">

            <h2>
                Populares
            </h2>

            <div
                class="movies"
                id="popularMovies"
            ></div>

        </section>


        <!-- FILMES -->

        <section class="section">

            <h2>
                Filmes
            </h2>

            <div
                class="movies"
                id="movieList"
            ></div>

        </section>


        <!-- SÉRIES -->

        <section class="section">

            <h2>
                Séries
            </h2>

            <div
                class="movies"
                id="seriesList"
            ></div>

        </section>


        <!-- MINHA LISTA -->

        <section class="section">

            <h2>
                Minha lista
            </h2>

            <div
                class="movies"
                id="myList"
            ></div>

            <div
                id="emptyList"
                class="no-results"
            >
                Você ainda não adicionou nenhum título.
            </div>

        </section>


        <!-- RESULTADOS -->

        <section
            class="section"
            id="searchResults"
        >

            <h2>
                Resultados da busca
            </h2>

            <div
                class="movies"
                id="searchMovies"
            ></div>

            <div
                id="noResults"
                class="no-results"
            >
                Nenhum título encontrado.
            </div>

        </section>

    </main>


    <!-- =========================
         MODAL
    ========================= -->

    <div
        class="modal"
        id="movieModal"
    >

        <button
            class="close-button"
            onclick="fecharModal()"
        >
            ×
        </button>

        <div class="modal-content">

            <div class="modal-top">

                <div
                    class="modal-title"
                    id="modalTitle"
                >
                    Filme
                </div>

            </div>

            <div class="modal-body">

                <p
                    class="modal-description"
                    id="modalDescription"
                ></p>

                <div class="modal-buttons">

                    <button
                        class="play-button"
                        onclick="assistirSelecionado()"
                    >
                        ▶ Assistir
                    </button>

                    <button
                        class="info-button"
                        onclick="adicionarSelecionado()"
                    >
                        ＋ Minha lista
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script>

        /* =====================================
           CONTA
        ===================================== */

        const conta = localStorage.getItem("hboFlixConta");

        if (!conta) {
            window.location.href = "index.html";
        }


        /* =====================================
           CATÁLOGO
        ===================================== */

        const catalogo = [

            {
                id: 1,
                titulo: "Horizonte",
                ano: 2026,
                tipo: "Filme",
                descricao: "Um novo começo em um mundo desconhecido.",
                poster: "",
                video: ""
            },

            {
                id: 2,
                titulo: "Código Zero",
                ano: 2026,
                tipo: "Filme",
                descricao: "Uma missão secreta muda tudo.",
                poster: "",
                video: ""
            },

            {
                id: 3,
                titulo: "Além do Tempo",
                ano: 2025,
                tipo: "Filme",
                descricao: "Uma aventura através do tempo.",
                poster: "",
                video: ""
            },

            {
                id: 4,
                titulo: "Distrito 9",
                ano: 2025,
                tipo: "Filme",
                descricao: "Uma cidade dividida por um segredo.",
                poster: "",
                video: ""
            },

            {
                id: 5,
                titulo: "Última Chamada",
                ano: 2025,
                tipo: "Filme",
                descricao: "Uma ligação pode mudar o destino.",
                poster: "",
                video: ""
            },

            {
                id: 6,
                titulo: "A Jornada",
                ano: 2025,
                tipo: "Filme",
                descricao: "Uma viagem que ninguém esperava.",
                poster: "",
                video: ""
            },

            {
                id: 7,
                titulo: "Operação Eclipse",
                ano: 2026,
                tipo: "Filme",
                descricao: "Uma operação perigosa começa durante um eclipse.",
                poster: "",
                video: ""
            },

            {
                id: 8,
                titulo: "Cidade Sombria",
                ano: 2025,
                tipo: "Série",
                descricao: "Mistérios escondidos nas ruas da cidade.",
                poster: "",
                video: ""
            },

            {
                id: 9,
                titulo: "Depois da Meia-Noite",
                ano: 2025,
                tipo: "Filme",
                descricao: "Nada é o que parece depois da meia-noite.",
                poster: "",
                video: ""
            },

            {
                id: 10,
                titulo: "O Último Sinal",
                ano: 2026,
                tipo: "Filme",
                descricao: "Um sinal misterioso chega do espaço.",
                poster: "",
                video: ""
            },

            {
                id: 11,
                titulo: "Conexão",
                ano: 2025,
                tipo: "Série",
                descricao: "Pessoas desconhecidas acabam conectadas.",
                poster: "",
                video: ""
            },

            {
                id: 12,
                titulo: "Arquivo 21",
                ano: 2026,
                tipo: "Série",
                descricao: "Um arquivo escondido guarda uma verdade.",
                poster: "",
                video: ""
            },

            {
                id: 13,
                titulo: "Nova Geração",
                ano: 2026,
                tipo: "Série",
                descricao: "Uma nova geração começa a mudar o mundo.",
                poster: "",
                video: ""
            },

            {
                id: 14,
                titulo: "Linha Vermelha",
                ano: 2025,
                tipo: "Filme",
                descricao: "Cruzar a linha pode ter consequências.",
                poster: "",
                video: ""
            },

            {
                id: 15,
                titulo: "Segredos",
                ano: 2025,
                tipo: "Série",
                descricao: "Todos escondem alguma coisa.",
                poster: "",
                video: ""
            },

            {
                id: 16,
                titulo: "Ponto Final",
                ano: 2026,
                tipo: "Filme",
                descricao: "Tudo termina em uma última decisão.",
                poster: "",
                video: ""
            }

        ];


        let filmeSelecionado = null;


        /* =====================================
           CRIAR CARD
        ===================================== */

        function criarCard(filme) {

            const card = document.createElement("div");

            card.className = "movie-card";

            card.onclick = function () {
                abrirFilme(filme);
            };


            let imagem = "";

            if (filme.poster) {

                imagem = `
                    <img
                        class="poster"
                        src="${filme.poster}"
                        alt="${filme.titulo}"
                    >
                `;

            } else {

                imagem = `
                    <div class="poster-placeholder">
                        ▶
                    </div>
                `;

            }


            card.innerHTML = `

                ${imagem}

                <div class="movie-info">

                    <div class="movie-title">
                        ${filme.titulo}
                    </div>

                    <div class="movie-year">
                        ${filme.ano} • ${filme.tipo}
                    </div>

                </div>

            `;

            return card;
        }


        /* =====================================
           MOSTRAR CATÁLOGO
        ===================================== */

        function carregarCatalogo(lista = catalogo) {

            const filmes =
                document.getElementById("movieList");

            const series =
                document.getElementById("seriesList");

            const populares =
                document.getElementById("popularMovies");

            filmes.innerHTML = "";
            series.innerHTML = "";
            populares.innerHTML = "";


            lista
                .filter(item => item.tipo === "Filme")
                .forEach(item => {

                    filmes.appendChild(
                        criarCard(item)
                    );

                });


            lista
                .filter(item => item.tipo === "Série")
                .forEach(item => {

                    series.appendChild(
                        criarCard(item)
                    );

                });


            lista
                .slice(0, 6)
                .forEach(item => {

                    populares.appendChild(
                        criarCard(item)
                    );

                });

        }


        /* =====================================
           MINHA LISTA
        ===================================== */

        function carregarMinhaLista() {

            const container =
                document.getElementById("myList");

            const empty =
                document.getElementById("emptyList");


            container.innerHTML = "";


            const ids =
                JSON.parse(
                    localStorage.getItem(
                        "hboFlixMinhaLista"
                    ) || "[]"
                );


            const lista =
                catalogo.filter(
                    filme => ids.includes(filme.id)
                );


            if (lista.length === 0) {

                empty.style.display = "block";

                return;

            }


            empty.style.display = "none";


            lista.forEach(filme => {

                container.appendChild(
                    criarCard(filme)
                );

            });

        }


        /* =====================================
           ABRIR FILME
        ===================================== */

        function abrirFilme(filme) {

            filmeSelecionado = filme;

            document.getElementById(
                "modalTitle"
            ).textContent = filme.titulo;


            document.getElementById(
                "modalDescription"
            ).textContent =
                filme.descricao;


            document.getElementById(
                "movieModal"
            ).style.display = "flex";

        }


        /* =====================================
           FECHAR MODAL
        ===================================== */

        function fecharModal() {

            document.getElementById(
                "movieModal"
            ).style.display = "none";

        }


        /* =====================================
           ASSISTIR
        ===================================== */

        function assistirSelecionado() {

            if (!filmeSelecionado) {
                return;
            }


            if (!filmeSelecionado.video) {

                alert(
                    "Este filme ainda não possui um vídeo conectado."
                );

                return;

            }


            window.location.href =
                "player.html?id=" +
                filmeSelecionado.id;

        }


        /* =====================================
           ADICIONAR À LISTA
        ===================================== */

        function adicionarSelecionado() {

            if (!filmeSelecionado) {
                return;
            }


            let lista =
                JSON.parse(
                    localStorage.getItem(
                        "hboFlixMinhaLista"
                    ) || "[]"
                );


            if (!lista.includes(
                filmeSelecionado.id
            )) {

                lista.push(
                    filmeSelecionado.id
                );

                localStorage.setItem(
                    "hboFlixMinhaLista",
                    JSON.stringify(lista)
                );

                alert(
                    "Adicionado à Minha Lista!"
                );

            } else {

                alert(
                    "Esse título já está na sua lista."
                );

            }


            carregarMinhaLista();

        }


        /* =====================================
           PESQUISA
        ===================================== */

        function toggleSearch() {

            const box =
                document.getElementById(
                    "searchBox"
                );


            if (
                box.style.display === "block"
            ) {

                box.style.display = "none";

            } else {

                box.style.display = "block";

                document.getElementById(
                    "searchInput"
                ).focus();

            }

        }


        function pesquisar() {

            const texto =
                document.getElementById(
                    "searchInput"
                ).value
                .toLowerCase()
                .trim();


            const section =
                document.getElementById(
                    "searchResults"
                );

            const container =
                document.getElementById(
                    "searchMovies"
                );

            const noResults =
                document.getElementById(
                    "noResults"
                );


            if (!texto) {

                section.style.display = "none";

                return;

            }


            section.style.display = "block";


            const resultados =
                catalogo.filter(
                    filme =>
                        filme.titulo
                            .toLowerCase()
                            .includes(texto)
                );


            container.innerHTML = "";


            resultados.forEach(filme => {

                container.appendChild(
                    criarCard(filme)
                );

            });


            if (resultados.length === 0) {

                noResults.style.display =
                    "block";

            } else {

                noResults.style.display =
                    "none";

            }

        }


        /* =====================================
           FILTRAR TIPO
        ===================================== */

        function filtrarTipo(tipo) {

            const lista =
                catalogo.filter(
                    filme => filme.tipo === tipo
                );


            window.scrollTo({
                top: 600,
                behavior: "smooth"
            });


            carregarCatalogo(lista);

        }


        /* =====================================
           MOSTRAR TODOS
        ===================================== */

        function mostrarTodos() {

            carregarCatalogo(catalogo);

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =====================================
           MINHA LISTA
        ===================================== */
