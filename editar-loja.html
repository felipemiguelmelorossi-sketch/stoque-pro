<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Minha Loja — EstoquePRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#07111f;
color:white;
padding:30px;
}

.container{
max-width:1000px;
margin:auto;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.back{
padding:12px 18px;
background:#17263a;
border:0;
border-radius:10px;
color:white;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.panel{
background:#0d1b2d;
border:1px solid #1d2b40;
border-radius:16px;
padding:25px;
}

label{
display:block;
color:#cbd5e1;
margin-bottom:7px;
}

input,
textarea{
width:100%;
padding:13px;
margin-bottom:18px;
background:#081525;
border:1px solid #26384f;
border-radius:10px;
color:white;
outline:none;
}

textarea{
min-height:110px;
resize:vertical;
}

button.save,
button.visit{
width:100%;
padding:14px;
border:0;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
}

.save{
background:#0ea5e9;
}

.visit{
background:#17263a;
margin-top:10px;
}

.url{
margin-top:18px;
padding:15px;
background:#081525;
border-radius:10px;
color:#38bdf8;
word-break:break-all;
}

.preview{
background:#081525;
border-radius:15px;
overflow:hidden;
}

.previewHeader{
padding:25px;
background:#0ea5e9;
}

.previewBody{
padding:25px;
}

@media(max-width:750px){

.grid{
grid-template-columns:1fr;
}

body{
padding:15px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="top">

<div>

<h1>🛍️ Minha Loja</h1>

<p style="color:#94a3b8;margin-top:6px;">
Personalize sua loja pública.
</p>

</div>

<button class="back"
onclick="location.href='dashboard.html'">

← Dashboard

</button>

</div>


<div class="grid">


<div class="panel">

<h2 style="margin-bottom:20px;">
Configuração
</h2>

<label>
Nome da loja
</label>

<input id="nome"
placeholder="Minha Loja">


<label>
Endereço da loja
</label>

<input id="slug"
placeholder="minha-loja">


<label>
Descrição
</label>

<textarea id="descricao"
placeholder="Descrição da sua loja"></textarea>


<label>
Cor principal
</label>

<input
id="cor"
type="color"
value="#0ea5e9">


<label>
Logo — URL da imagem
</label>

<input
id="logo"
placeholder="https://...">


<button
class="save"
onclick="salvar()">

💾 Publicar loja

</button>


<button
class="visit"
onclick="visitar()">

🌐 Abrir minha loja

</button>


<div class="url" id="url">
Ainda não publicada.
</div>

</div>


<div class="panel">

<h2 style="margin-bottom:20px;">
Pré-visualização
</h2>

<div class="preview">

<div
class="previewHeader"
id="previewHeader">

<h2 id="previewNome">
Minha Loja
</h2>

</div>

<div class="previewBody">

<p id="previewDescricao"
style="color:#94a3b8;">

Descrição da loja

</p>

</div>

</div>

</div>


</div>

</div>


<script>

let usuario;

async function iniciar(){

const {data}=await supabaseClient.auth.getUser();

if(!data.user){

location.href="index.html";
return;

}

usuario=data.user;

carregarLoja();

}

async function carregarLoja(){

const {data}=await supabaseClient
.from("lojas")
.select("*")
.eq("usuario_id",usuario.id)
.maybeSingle();

if(!data) return;

document.getElementById("nome").value=data.nome||"";
document.getElementById("slug").value=data.slug||"";
document.getElementById("descricao").value=data.descricao||"";
document.getElementById("cor").value=data.cor||"#0ea5e9";
document.getElementById("logo").value=data.logo||"";

atualizarPreview(data);

mostrarURL(data.slug);

}

function limparSlug(valor){

return valor
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9-]/g,"-")
.replace(/-+/g,"-")
.replace(/^-|-$/g,"");

}

function mostrarURL(slug){

if(!slug){

document.getElementById("url").textContent=
"Ainda não publicada.";

return;

}

document.getElementById("url").textContent=
location.origin+
location.pathname.replace(
"editar-loja.html",
""
)+
"loja.html?loja="+
encodeURIComponent(slug);

}

function atualizarPreview(loja){

document.getElementById("previewNome").textContent=
loja.nome||"Minha Loja";

document.getElementById("previewDescricao").textContent=
loja.descricao||"Descrição da loja";

document.getElementById("previewHeader").style.background=
loja.cor||"#0ea5e9";

}

async function salvar(){

let nome=
document.getElementById("nome").value.trim();

let slug=
limparSlug(
document.getElementById("slug").value.trim()
);

let descricao=
document.getElementById("descricao").value.trim();

let cor=
document.getElementById("cor").value;

let logo=
document.getElementById("logo").value.trim();

if(!nome){

alert("Digite o nome da loja.");
return;

}

if(!slug){

alert("Digite o endereço da loja.");
return;

}

const {data:existente}=await supabaseClient
.from("lojas")
.select("id")
.eq("slug",slug)
.neq("usuario_id",usuario.id)
.maybeSingle();

if(existente){

alert("Esse endereço já está sendo usado.");
return;

}

const {error}=await supabaseClient
.from("lojas")
.upsert({

usuario_id:usuario.id,
nome:nome,
slug:slug,
descricao:descricao,
cor:cor,
logo:logo

},{
onConflict:"usuario_id"
});

if(error){

alert(error.message);
return;

}

document.getElementById("slug").value=slug;

atualizarPreview({
nome,
descricao,
cor
});

mostrarURL(slug);

alert("Sua loja foi publicada!");

}

async function visitar(){

const {data}=await supabaseClient
.from("lojas")
.select("slug")
.eq("usuario_id",usuario.id)
.single();

if(!data){

alert("Publique sua loja primeiro.");
return;

}

location.href=
"loja.html?loja="+
encodeURIComponent(data.slug);

}

iniciar();

</script>

</body>
</html>
