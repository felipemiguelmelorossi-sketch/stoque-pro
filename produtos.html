<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EstoquePRO — Produtos</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070a10;
            --sidebar: #0b0f18;
            --card: #101621;
            --card2: #0c111b;
            --border: #202938;
            --text: #f5f7fb;
            --muted: #8993a5;
            --blue: #2563eb;
            --blue-light: #60a5fa;
            --green: #22c55e;
            --orange: #f59e0b;
            --red: #ef4444;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;

            width: 250px;

            background: var(--sidebar);

            border-right: 1px solid var(--border);

            padding: 24px 16px;

            display: flex;
            flex-direction: column;

            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 0 10px;

            margin-bottom: 35px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            font-size: 20px;
            font-weight: 900;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 900;
        }

        .brand-name span {
            color: var(--blue-light);
        }

        .menu-title {
            padding: 0 12px;

            margin-bottom: 10px;

            color: #596477;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu button {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 12px;

            border: 0;

            border-radius: 10px;

            padding: 12px;

            background: transparent;

            color: var(--muted);

            cursor: pointer;

            text-align: left;

            font-size: 14px;

            font-weight: 700;

            transition: 0.2s;
        }

        .menu button:hover {
            background: #121925;
            color: white;
        }

        .menu button.active {
            background:
                rgba(37, 99, 235, 0.15);

            color: #60a5fa;
        }

        .menu-icon {
            width: 20px;
            text-align: center;
            font-size: 17px;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .user-mini {
            border-top: 1px solid var(--border);

            padding: 18px 8px 5px;

            display: flex;

            align-items: center;

            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #1d4ed8;

            font-size: 14px;

            font-weight: 900;
        }

        .user-info {
            min-width: 0;
            flex: 1;
        }

        .user-info strong {
            display: block;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 13px;
        }

        .user-info span {
            display: block;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            color: var(--muted);

            font-size: 11px;

            margin-top: 3px;
        }

        .logout {
            border: 0;

            background: transparent;

            color: #6f798b;

            cursor: pointer;

            font-size: 17px;
        }

        .logout:hover {
            color: #f87171;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 250px;

            min-height: 100vh;

            padding: 30px;
        }

        .topbar {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 28px;

            letter-spacing: -0.7px;
        }

        .page-title p {
            color: var(--muted);

            font-size: 14px;

            margin-top: 7px;
        }

        .back-button {
            border: 1px solid var(--border);

            background: var(--card);

            color: #cbd5e1;

            border-radius: 10px;

            padding: 11px 15px;

            cursor: pointer;

            font-size: 13px;

            font-weight: 700;
        }

        .back-button:hover {
            background: #141b28;
            color: white;
        }

        /* =========================
           FORM CARD
        ========================= */

        .form-card {
            max-width: 900px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 17px;

            padding: 25px;

            margin-bottom: 25px;
        }

        .form-title {
            margin-bottom: 22px;
        }

        .form-title h2 {
            font-size: 17px;
        }

        .form-title p {
            color: var(--muted);

            font-size: 12px;

            margin-top: 6px;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            color: #d5d9e2;

            font-size: 12px;

            font-weight: 700;
        }

        .field input,
        .field select {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #293246;

            border-radius: 10px;

            outline: none;

            background: #0a0e17;

            color: white;

            font-size: 13px;

            transition: 0.2s;
        }

        .field select {
            cursor: pointer;
        }

        .field input:focus,
        .field select:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px
                rgba(59, 130, 246, 0.12);
        }

        .field input::placeholder {
            color: #596274;
        }

        .form-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 22px;

            padding-top: 20px;

            border-top: 1px solid var(--border);
        }

        .button {
            border: 0;

            border-radius: 10px;

            padding: 12px 18px;

            cursor: pointer;

            font-size: 13px;

            font-weight: 800;
        }

        .cancel-button {
            background: #151b27;

            color: #aeb7c6;
        }

        .cancel-button:hover {
            background: #1b2331;
            color: white;
        }

        .save-button {
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;
        }

        .save-button:hover {
            filter: brightness(1.08);
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products-card {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 17px;

            overflow: hidden;
        }

        .products-header {
            padding: 20px;

            border-bottom: 1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }

        .products-header h2 {
            font-size: 16px;
        }

        .products-count {
            color: var(--muted);

            font-size: 12px;

            margin-top: 5px;
        }

        .search {
            width: 260px;

            padding: 11px 13px;

            border: 1px solid var(--border);

            border-radius: 10px;

            outline: none;

            background: #0a0e17;

            color: white;

            font-size: 12px;
        }

        .search:focus {
            border-color: #3b82f6;
        }

        .table-container {
            width: 100%;

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 720px;
        }

        th {
            padding: 13px 18px;

            background: #0c111b;

            color: #667186;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            text-align: left;
        }

        td {
            padding: 15px 18px;

            border-top: 1px solid
                rgba(32, 41, 56, 0.7);

            font-size: 12px;
        }

        tr:hover td {
            background: #121925;
        }

        .product-name {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .product-emoji {
            width: 35px;
            height: 35px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 9px;

            background: #172033;

            font-size: 16px;
        }

        .product-name strong {
            display: block;

            font-size: 12px;
        }

        .product-name small {
            display: block;

            color: #677286;

            font-size: 10px;

            margin-top: 3px;
        }

        .category {
            color: #aeb7c6;
        }

        .price {
            font-weight: 800;
        }

        .stock {
            font-weight: 900;
        }

        .stock.good {
            color: #4ade80;
        }

        .stock.low {
            color: #fbbf24;
        }

        .stock.empty {
            color: #f87171;
        }

        .badge {
            display: inline-block;

            padding: 5px 8px;

            border-radius: 20px;

            font-size: 9px;

            font-weight: 800;
        }

        .badge.good {
            background:
                rgba(34,197,94,0.1);

            color: #4ade80;
        }

        .badge.low {
            background:
                rgba(245,158,11,0.1);

            color: #fbbf24;
        }

        .badge.empty {
            background:
                rgba(239,68,68,0.1);

            color: #f87171;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .action-button {
            width: 31px;
            height: 31px;

            border: 1px solid var(--border);

            border-radius: 8px;

            background: #0c111b;

            color: #9ca6b7;

            cursor: pointer;
        }

        .action-button:hover {
            background: #192131;

            color: white;
        }

        .action-button.delete:hover {
            color: #f87171;

            border-color:
                rgba(239,68,68,0.3);
        }

        /* =========================
           EMPTY
        ========================= */

        .empty {
            padding: 55px 20px;

            text-align: center;

            color: var(--muted);
        }

        .empty-icon {
            font-size: 38px;

            margin-bottom: 12px;
        }

        .empty h3 {
            color: #d8dee8;

            font-size: 15px;

            margin-bottom: 7px;
        }

        .empty p {
            font-size: 12px;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;

            position: fixed;

            right: 25px;

            bottom: 25px;

            z-index: 500;

            max-width: 350px;

            padding: 13px 16px;

            border-radius: 11px;

            font-size: 12px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.35);
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #12351f;

            border: 1px solid #1d6635;

            color: #86efac;
        }

        .message.error {
            background: #381419;

            border: 1px solid #70242c;

            color: #fca5a5;
        }

        /* =========================
           MOBILE
        ========================= */

        .mobile-header {
            display: none;
        }

        @media (max-width: 750px) {

            .sidebar {
                display: none;
            }

            .mobile-header {
                position: fixed;

                display: flex;

                align-items: center;

                justify-content: space-between;

                top: 0;
                left: 0;
                right: 0;

                height: 62px;

                padding: 0 18px;

                background:
                    rgba(11,15,24,0.97);

                border-bottom:
                    1px solid var(--border);

                z-index: 200;
            }

            .mobile-brand {
                font-size: 18px;

                font-weight: 900;
            }

            .mobile-brand span {
                color: var(--blue-light);
            }

            .mobile-menu {
                border: 0;

                background: transparent;

                color: white;

                font-size: 22px;

                cursor: pointer;
            }

            .main {
                margin-left: 0;

                padding: 20px;

                padding-top: 82px;
            }

            .topbar {
                align-items: flex-start;

                flex-direction: column;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .products-header {
                align-items: flex-start;

                flex-direction: column;
            }

            .search {
                width: 100%;
            }

        }

        @media (max-width: 500px) {

            .main {
                padding: 15px;

                padding-top: 78px;
            }

            .form-card {
                padding: 18px;
            }

            .form-actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }

            .message {
                left: 15px;
                right: 15px;
                bottom: 15px;
            }
        }

    </style>

</head>

<body>


    <!-- =========================
         MOBILE
    ========================= -->

    <header class="mobile-header">

        <div class="mobile-brand">
            Estoque<span>PRO</span>
        </div>

        <button
            class="mobile-menu"
            onclick="irDashboard()"
        >
            ←
        </button>

    </header>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                E
            </div>

            <div class="brand-name">
                Estoque<span>PRO</span>
            </div>

        </div>


        <div class="menu-title">
            Principal
        </div>


        <nav class="menu">

            <button
                onclick="irDashboard()"
            >
                <span class="menu-icon">
                    ▦
                </span>

                Dashboard
            </button>


            <button
                class="active"
            >
                <span class="menu-icon">
                    □
                </span>

                Produtos
            </button>


            <button
                onclick="alert('A área de movimentações será ativada no próximo passo.')"
            >
                <span class="menu-icon">
                    ↕
                </span>

                Movimentações
            </button>


            <button
                onclick="alert('Os relatórios serão adicionados posteriormente.')"
            >
                <span class="menu-icon">
                    ▤
                </span>

                Relatórios
            </button>

        </nav>


        <div
            class="menu-title"
            style="margin-top:30px;"
        >
            Conta
        </div>


        <nav class="menu">

            <button onclick="mostrarPerfil()">

                <span class="menu-icon">
                    ○
                </span>

                Meu perfil

            </button>


            <button onclick="mostrarPro()">

                <span class="menu-icon">
                    ★
                </span>

                EstoquePRO PRO

            </button>

        </nav>


        <div class="sidebar-bottom">

            <div class="user-mini">

                <div
                    class="avatar"
                    id="avatar"
                >
                    ?
                </div>


                <div class="user-info">

                    <strong id="nomeUsuario">
                        Usuário
                    </strong>

                    <span id="emailUsuario">
                        —
                    </span>

                </div>


                <button
                    class="logout"
                    onclick="sair()"
                    title="Sair"
                >
                    ↪
                </button>

            </div>

        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">


        <div class="topbar">

            <div class="page-title">

                <h1>
                    Produtos
                </h1>

                <p>
                    Cadastre e controle os produtos do seu estoque.
                </p>

            </div>


            <button
                class="back-button"
                onclick="irDashboard()"
            >
                ← Dashboard
            </button>

        </div>


        <!-- =========================
             FORMULÁRIO
        ========================= -->

        <section class="form-card">

            <div class="form-title">

                <h2 id="formTitulo">
                    Adicionar produto
                </h2>

                <p>
                    Preencha os dados abaixo para cadastrar um produto.
                </p>

            </div>


            <form
                id="produtoForm"
                onsubmit="salvarProduto(event)"
            >

                <div class="form-grid">


                    <div class="field full">

                        <label for="nome">
                            Nome do produto
                        </label>

                        <input
                            id="nome"
                            type="text"
                            placeholder="Ex.: Coca-Cola 2L"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="categoria">
                            Categoria
                        </label>

                        <select
                            id="categoria"
                            required
                        >

                            <option value="">
                                Selecione uma categoria
                            </option>

                            <option value="Alimentos">
                                Alimentos
                            </option>

                            <option value="Bebidas">
                                Bebidas
                            </option>

                            <option value="Eletrônicos">
                                Eletrônicos
                            </option>

                            <option value="Roupas">
                                Roupas
                            </option>

                            <option value="Casa">
                                Casa
                            </option>

                            <option value="Beleza">
                                Beleza
                            </option>

                            <option value="Outros">
                                Outros
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="codigo">
                            Código do produto
                        </label>

                        <input
                            id="codigo"
                            type="text"
                            placeholder="Ex.: PROD-001"
                        >

                    </div>


                    <div class="field">

                        <label for="preco">
                            Preço unitário
                        </label>

                        <input
                            id="preco"
                            type="number"
                            min="0"
                            step="0.01"
                            placeholder="0,00"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="quantidade">
                            Quantidade inicial
                        </label>

                        <input
                            id="quantidade"
                            type="number"
                            min="0"
                            step="1"
                            placeholder="0"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="minimo">
                            Estoque mínimo
                        </label>

                        <input
                            id="minimo"
                            type="number"
                            min="0"
                            step="1"
                            placeholder="Ex.: 5"
                            value="5"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="icone">
                            Ícone do produto
                        </label>

                        <select id="icone">

                            <option value="📦">
                                📦 Produto
                            </option>

                            <option value="🥤">
                                🥤 Bebida
                            </option>

                            <option value="🍔">
                                🍔 Alimento
                            </option>

                            <option value="👕">
                                👕 Roupa
                            </option>

                            <option value="📱">
                                📱 Eletrônico
                            </option>

                            <option value="💄">
                                💄 Beleza
                            </option>

                            <option value="🏠">
                                🏠 Casa
                            </option>

                        </select>

                    </div>


                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        class="button cancel-button"
                        onclick="limparFormulario()"
                    >
                        Limpar
                    </button>


                    <button
                        type="submit"
                        class="button save-button"
                    >
                        Salvar produto
                    </button>

                </div>

            </form>

        </section>


        <!-- =========================
             LISTA
        ========================= -->

        <section class="products-card">

            <div class="products-header">

                <div>

                    <h2>
                        Produtos cadastrados
                    </h2>

                    <div
                        class="products-count"
                        id="productsCount"
                    >
                        0 produtos
                    </div>

                </div>


                <input
                    id="pesquisa"
                    class="search"
                    type="search"
                    placeholder="Pesquisar produto..."
                    oninput="renderizarProdutos()"
                >

            </div>


            <div
                class="table-container"
                id="tabelaContainer"
            >
            </div>

        </section>


    </main>


    <div
        id="message"
        class="message"
    ></div>


    <script>

        /* =========================
           CONFIGURAÇÃO
        ========================= */

        const CHAVE_CONTA =
            "estoqueProConta";

        const CHAVE_LOGIN =
            "estoqueProLogado";

        const CHAVE_PRODUTOS =
            "estoqueProProdutos";

        const CHAVE_MOVIMENTACOES =
            "estoqueProMovimentacoes";


        let produtoEditandoId = null;


        /* =========================
           PROTEÇÃO
        ========================= */

        if (
            localStorage.getItem(
                CHAVE_LOGIN
            ) !== "true"
        ) {

            window.location.href =
                "index.html";

        }


        /* =========================
           CONTA
        ========================= */

        let conta = null;

        const contaSalva =
            localStorage.getItem(
                CHAVE_CONTA
            );

        if (contaSalva) {

            try {

                conta =
                    JSON.parse(
                        contaSalva
                    );

            } catch (erro) {

                conta = null;

            }

        }


        function carregarUsuario() {

            if (!conta) {
                return;
            }


            const nome =
                conta.nome ||
                "Usuário";


            const email =
                conta.email ||
                "";


            document.getElementById(
                "nomeUsuario"
            ).textContent =
                nome;


            document.getElementById(
                "emailUsuario"
            ).textContent =
                email;


            document.getElementById(
                "avatar"
            ).textContent =
                nome
                    .trim()
                    .charAt(0)
                    .toUpperCase() ||
                "?";
        }


        /* =========================
           PRODUTOS
        ========================= */

        function obterProdutos() {

            const dados =
                localStorage.getItem(
                    CHAVE_PRODUTOS
                );


            if (!dados) {
                return [];
            }


            try {

                const produtos =
                    JSON.parse(
                        dados
                    );


                return Array.isArray(
                    produtos
                )
                    ? produtos
                    : [];

            } catch (erro) {

                return [];

            }
        }


        function salvarProdutos(
            produtos
        ) {

            localStorage.setItem(
                CHAVE_PRODUTOS,
                JSON.stringify(
                    produtos
                )
            );

        }


        /* =========================
           SALVAR
        ========================= */

        function salvarProduto(
            event
        ) {

            event.preventDefault();


            const nome =
                document
                    .getElementById("nome")
                    .value
                    .trim();


            const categoria =
                document
                    .getElementById("categoria")
                    .value;


            const codigo =
                document
                    .getElementById("codigo")
                    .value
                    .trim();


            const preco =
                Number(
                    document
                        .getElementById("preco")
                        .value
                );


            const quantidade =
                Number(
                    document
                        .getElementById("quantidade")
                        .value
                );


            const minimo =
                Number(
                    document
                        .getElementById("minimo")
                        .value
                );


            const icone =
                document
                    .getElementById("icone")
                    .value;


            if (!nome) {

                mostrarMensagem(
                    "Digite o nome do produto.",
                    "error"
                );

                return;
            }


            if (!categoria) {

                mostrarMensagem(
                    "Selecione uma categoria.",
                    "error"
                );

                return;
            }


            if (
                Number.isNaN(preco) ||
                preco < 0
            ) {

                mostrarMensagem(
                    "Digite um preço válido.",
                    "error"
                );

                return;
            }


            if (
                Number.isNaN(quantidade) ||
                quantidade < 0
            ) {

                mostrarMensagem(
                    "Digite uma quantidade válida.",
                    "error"
                );

                return;
            }


            if (
                Number.isNaN(minimo) ||
                minimo < 0
            ) {

                mostrarMensagem(
                    "Digite um estoque mínimo válido.",
                    "error"
                );

                return;
            }


            const produtos =
                obterProdutos();


            /* =========================
               EDITAR
            ========================= */

            if (produtoEditandoId !== null) {

                const index =
                    produtos.findIndex(
                        produto =>
                            produto.id ===
                            produtoEditandoId
                    );


                if (index === -1) {

                    mostrarMensagem(
                        "Produto não encontrado.",
                        "error"
                    );

                    return;
                }


                const quantidadeAntiga =
                    Number(
                        produtos[index]
                            .quantidade
                    ) || 0;


                produtos[index] = {

                    ...produtos[index],

                    nome,

                    categoria,

                    codigo,

                    preco,

                    quantidade,

                    minimo,

                    icone,

                    atualizadoEm:
                        Date.now()

                };


                salvarProdutos(
                    produtos
                );


                registrarMovimentacao(
                    produtos[index],
                    quantidade -
                    quantidadeAntiga
                );


                mostrarMensagem(
                    "Produto atualizado com sucesso!",
                    "success"
                );


                limparFormulario();

                renderizarProdutos();

                return;
            }


            /* =========================
               NOVO PRODUTO
            ========================= */

            const produto = {

                id:
                    Date.now(),

                nome,

                categoria,

                codigo,

                preco,

                quantidade,

                minimo,

                icone,

                criadoEm:
                    Date.now(),

                atualizadoEm:
                    Date.now()

            };


            produtos.push(
                produto
            );


            salvarProdutos(
                produtos
            );


            if (quantidade > 0) {

                registrarMovimentacao(
                    produto,
                    quantidade,
                    "entrada"
                );

            }


            mostrarMensagem(
                "Produto cadastrado com sucesso!",
                "success"
            );


            limparFormulario();

            renderizarProdutos();

        }


        /* =========================
           MOVIMENTAÇÕES
        ========================= */

        function registrarMovimentacao(
            produto,
            quantidade,
            tipo = null
        ) {

            if (
                !quantidade ||
                quantidade === 0
            ) {
                return;
            }


            let movimentacoes =
                obterMovimentacoes();


            const tipoFinal =
                tipo ||
                (
                    quantidade > 0
                        ? "entrada"
                        : "saida"
                );


            movimentacoes.push({

                id:
                    Date.now() +
                    Math.random(),

                produtoId:
                    produto.id,

                produtoNome:
                    produto.nome,

                quantidade:
                    Math.abs(
                        quantidade
                    ),

                tipo:
                    tipoFinal,

                data:
                    Date.now()

            });


            /* Limita o histórico */

            if (
                movimentacoes.length >
                200
            ) {

                movimentacoes =
                    movimentacoes.slice(
                        -200
                    );

            }


            localStorage.setItem(
                CHAVE_MOVIMENTACOES,
                JSON.stringify(
                    movimentacoes
                )
            );

        }


        function obterMovimentacoes() {

            const dados =
                localStorage.getItem(
                    CHAVE_MOVIMENTACOES
                );


            if (!dados) {
                return [];
            }


            try {

                const movimentacoes =
                    JSON.parse(
                        dados
                    );


                return Array.isArray(
                    movimentacoes
                )
                    ? movimentacoes
                    : [];

            } catch (erro) {

                return [];

            }

        }


        /* =========================
           RENDERIZAR
        ========================= */

        function renderizarProdutos() {

            const produtos =
                obterProdutos();


            const pesquisa =
                document
                    .getElementById(
                        "pesquisa"
                    )
                    .value
                    .trim()
                    .toLowerCase();


            const filtrados =
                produtos.filter(
                    produto => {

                        const nome =
                            String(
                                produto.nome ||
                                ""
                            ).toLowerCase();


                        const categoria =
                            String(
                                produto.categoria ||
                                ""
                            ).toLowerCase();


                        const codigo =
                            String(
                                produto.codigo ||
                                ""
                            ).toLowerCase();


                        return (
                            nome.includes(
                                pesquisa
                            ) ||
                            categoria.includes(
                                pesquisa
                            ) ||
                            codigo.includes(
                                pesquisa
                            )
                        );

                    }
                );


            document.getElementById(
                "productsCount"
            ).textContent =
                produtos.length +
                (
                    produtos.length === 1
                        ? " produto"
                        : " produtos"
                );


            const container =
                document.getElementById(
                    "tabelaContainer"
                );


            if (!filtrados.length) {

                container.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            📦
                        </div>

                        <h3>
                            ${
                                produtos.length
                                    ? "Nenhum produto encontrado"
                                    : "Nenhum produto cadastrado"
                            }
                        </h3>

                        <p>
                            ${
                                produtos.length
                                    ? "Tente pesquisar por outro nome ou código."
                                    : "Cadastre seu primeiro produto usando o formulário acima."
                            }
                        </p>

                    </div>

                `;

                return;
            }


            container.innerHTML = `

                <table>

                    <thead>

                        <tr>

                            <th>
                                Produto
                            </th>

                            <th>
                                Categoria
                            </th>

                            <th>
                                Preço
                            </th>

                            <th>
                                Estoque
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Ações
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        ${
                            filtrados
                                .map(
                                    produto =>
                                        criarLinhaProduto(
                                            produto
                                        )
                                )
                                .join("")
                        }

                    </tbody>

                </table>

            `;

        }


        function criarLinhaProduto(
            produto
        ) {

            const quantidade =
                Number(
                    produto.quantidade
                ) || 0;


            const minimo =
                Number(
                    produto.minimo
                ) || 0;


            let classe =
                "good";


            let texto =
                "Normal";


            if (
                quantidade === 0
            ) {

                classe =
                    "empty";

                texto =
                    "Esgotado";

            } else if (
                quantidade <= minimo
            ) {

                classe =
                    "low";

                texto =
                    "Estoque baixo";

            }


            return `

                <tr>

                    <td>

                        <div class="product-name">

                            <div class="product-emoji">
                                ${
                                    produto.icone ||
                                    "📦"
                                }
                            </div>

                            <div>

                                <strong>
                                    ${
                                        escaparHTML(
                                            produto.nome
                                        )
                                    }
                                </strong>

                                <small>
                                    ${
                                        produto.codigo
                                            ? escaparHTML(
                                                produto.codigo
                                            )
                                            : "Sem código"
                                    }
                                </small>

                            </div>

                        </div>

                    </td>


                    <td>

                        <span class="category">
                            ${
                                escaparHTML(
                                    produto.categoria ||
                                    "—"
                                )
                            }
                        </span>

                    </td>


                    <td>

                        <span class="price">
                            ${
                                formatarMoeda(
                                    produto.preco
                                )
                            }
                        </span>

                    </td>


                    <td>

                        <span class="stock ${classe}">
                            ${quantidade}
                        </span>

                    </td>


                    <td>

                        <span class="badge ${classe}">
                            ${texto}
                        </span>

                    </td>


                    <td>

                        <div class="actions">

                            <button
                                class="action-button"
                                onclick="editarProduto(${produto.id})"
                                title="Editar"
                            >
                                ✎
                            </button>


                            <button
                                class="action-button delete"
                                onclick="excluirProduto(${produto.id})"
                                title="Excluir"
                            >
                                ×
                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }


        /* =========================
           EDITAR
        ========================= */

        function editarProduto(
            id
        ) {

            const produtos =
                obterProdutos();


            const produto =
                produtos.find(
                    item =>
                        item.id === id
                );


            if (!produto) {

                mostrarMensagem(
                    "Produto não encontrado.",
                    "error"
                );

                return;
            }


            produtoEditandoId =
                id;


            document.getElementById(
                "formTitulo"
            ).textContent =
                "Editar produto";


            document.getElementById(
                "nome"
            ).value =
                produto.nome || "";


            document.getElementById(
                "categoria"
            ).value =
                produto.categoria || "";


            document.getElementById(
                "codigo"
            ).value =
                produto.codigo || "";


            document.getElementById(
                "preco"
            ).value =
                produto.preco ?? "";


            document.getElementById(
                "quantidade"
            ).value =
                produto.quantidade ?? "";


            document.getElementById(
                "minimo"
            ).value =
                produto.minimo ?? 5;


            document.getElementById(
                "icone"
            ).value =
                produto.icone || "📦";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =========================
           EXCLUIR
        ========================= */

        function excluirProduto(
            id
        ) {

            const produtos =
                obterProdutos();


            const produto =
                produtos.find(
                    item =>
                        item.id === id
                );


            if (!produto) {
                return;
            }


            const confirmar =
                confirm(
                    "Excluir o produto \"" +
                    produto.nome +
                    "\"?"
                );


            if (!confirmar) {
                return;
            }


            const novosProdutos =
                produtos.filter(
                    item =>
                        item.id !== id
                );


            salvarProdutos(
                novosProdutos
            );


            if (
                produtoEditandoId === id
            ) {

                limparFormulario();

            }


            mostrarMensagem(
                "Produto excluído.",
                "success"
            );


            renderizarProdutos();

        }


        /* =========================
           LIMPAR
        ========================= */

        function limparFormulario() {

            produtoEditandoId =
                null;


            document.getElementById(
                "formTitulo"
            ).textContent =
                "Adicionar produto";


            document
                .getElementById(
                    "produtoForm"
                )
                .reset();


            document.getElementById(
                "minimo"
            ).value =
                5;


            document.getElementById(
                "icone"
            ).value =
                "📦";

        }


        /* =========================
           NAVEGAÇÃO
        ========================= */

        function irDashboard() {

            window.location.href =
                "dashboard.html";

        }


        /* =========================
           PERFIL
        ========================= */

        function mostrarPerfil() {

            if (!conta) {
                return;
            }


            alert(
                "Meu perfil\n\n" +
                "Nome: " +
                conta.nome +
                "\n" +
                "E-mail: " +
                conta.email
            );

        }


        function mostrarPro() {

            alert(
                "EstoquePRO PRO\n\n" +
                "Os recursos PRO serão adicionados posteriormente."
            );

        }


        /* =========================
           LOGOUT
        ========================= */

        function sair() {

            const confirmar =
                confirm(
                    "Deseja realmente sair?"
                );


            if (!confirmar) {
                return;
            }


            localStorage.removeItem(
                CHAVE_LOGIN
            );


            window.location.href =
                "index.html";

        }


        /* =========================
           MENSAGEM
        ========================= */

        let mensagemTimeout;


        function mostrarMensagem(
            texto,
            tipo
        ) {

            const elemento =
                document.getElementById(
                    "message"
                );


            elemento.textContent =
                texto;


            elemento.className =
                "message show " +
                tipo;


            clearTimeout(
                mensagemTimeout
            );


            mensagemTimeout =
                setTimeout(
                    () => {

                        elemento.className =
                            "message";

                    },
                    3000
                );

        }


        /* =========================
           UTILITÁRIOS
        ========================= */

        function formatarMoeda(
            valor
        ) {

            return Number(
                valor || 0
            ).toLocaleString(
                "pt-BR",
                {
                    style: "currency",
                    currency: "BRL"
                }
            );

        }


        function escaparHTML(
            texto
        ) {

            return String(
                texto
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        /* =========================
           INICIAR
        ========================= */

        carregarUsuario();

        renderizarProdutos();

    </script>

</body>

</html>
