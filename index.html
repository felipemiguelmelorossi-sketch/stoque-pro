<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HBO Flix</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 20px 70px rgba(0,0,0,.5);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 900;
            color: #b88cff;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            background: #191919;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            border: 0;
            background: transparent;
            color: #888;
            padding: 11px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab.active {
            background: #292929;
            color: white;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            background: #191919;
            border: 1px solid #303030;
            color: white;
            padding: 13px;
            border-radius: 7px;
            outline: none;
            margin-bottom: 17px;
        }

        input:focus {
            border-color: #8d5cff;
        }

        .main-button {
            width: 100%;
            border: 0;
            padding: 14px;
            border-radius: 8px;
            background: linear-gradient(90deg, #7746d8, #a66cff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .main-button:hover {
            opacity: .9;
        }

        .plan {
            margin-top: 20px;
            background: #191919;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            color: #ccc;
            font-size: 14px;
        }

        .plan strong {
            color: white;
        }

        .error {
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
        }

        .success {
            color: #72e6a1;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">HBO FLIX</div>

    <div class="subtitle">
        Filmes e séries em um só lugar.
    </div>

    <div class="tabs">
        <button class="tab active" id="loginTab" onclick="showLogin()">
            Entrar
        </button>

        <button class="tab" id="registerTab" onclick="showRegister()">
            Criar conta
        </button>
    </div>

    <!-- LOGIN -->

    <div class="form active" id="loginForm">

        <label>E-mail</label>
        <input
            type="email"
            id="loginEmail"
            placeholder="seu@email.com"
        >

        <label>Senha</label>
        <input
            type="password"
            id="loginPassword"
            placeholder="Sua senha"
        >

        <div class="error" id="loginError"></div>

        <button class="main-button" onclick="login()">
            Entrar
        </button>

    </div>

    <!-- CADASTRO -->

    <div class="form" id="registerForm">

        <label>Nome</label>
        <input
            type="text"
            id="registerName"
            placeholder="Seu nome"
        >

        <label>E-mail</label>
        <input
            type="email"
            id="registerEmail"
            placeholder="seu@email.com"
        >

        <label>Senha</label>
        <input
            type="password"
            id="registerPassword"
            placeholder="Crie uma senha"
        >

        <div class="error" id="registerError"></div>

        <div class="success" id="registerSuccess"></div>

        <button class="main-button" onclick="createAccount()">
            Criar conta
        </button>

    </div>

    <div class="plan">
        Plano HBO Flix:
        <strong>R$ 4,99/mês</strong>
    </div>

</div>

<script>

    function showLogin() {

        document.getElementById("loginForm").classList.add("active");
        document.getElementById("registerForm").classList.remove("active");

        document.getElementById("loginTab").classList.add("active");
        document.getElementById("registerTab").classList.remove("active");
    }

    function showRegister() {

        document.getElementById("registerForm").classList.add("active");
        document.getElementById("loginForm").classList.remove("active");

        document.getElementById("registerTab").classList.add("active");
        document.getElementById("loginTab").classList.remove("active");
    }


    function createAccount() {

        const nome =
            document.getElementById("registerName").value.trim();

        const email =
            document.getElementById("registerEmail").value.trim();

        const senha =
            document.getElementById("registerPassword").value;

        const error =
            document.getElementById("registerError");

        const success =
            document.getElementById("registerSuccess");

        error.style.display = "none";
        success.style.display = "none";

        if (!nome || !email || !senha) {

            error.textContent =
                "Preencha todos os campos.";

            error.style.display = "block";

            return;
        }

        if (senha.length < 6) {

            error.textContent =
                "A senha precisa ter pelo menos 6 caracteres.";

            error.style.display = "block";

            return;
        }

        const conta = {
            nome: nome,
            email: email,
            senha: senha
        };

        // Salva a conta no navegador
        localStorage.setItem(
            "hboFlixConta",
            JSON.stringify(conta)
        );

        // Marca o usuário como logado
        localStorage.setItem(
            "hboFlixLogado",
            "true"
        );

        success.textContent =
            "Conta criada! Entrando no HBO Flix...";

        success.style.display = "block";

        // Abre a Home
        setTimeout(function() {

            window.location.href = "home.html";

        }, 700);
    }


    function login() {

        const email =
            document.getElementById("loginEmail").value.trim();

        const senha =
            document.getElementById("loginPassword").value;

        const error =
            document.getElementById("loginError");

        error.style.display = "none";

        const contaSalva =
            localStorage.getItem("hboFlixConta");

        if (!contaSalva) {

            error.textContent =
                "Nenhuma conta foi cadastrada neste navegador.";

            error.style.display = "block";

            return;
        }

        const conta = JSON.parse(contaSalva);

        if (
            email === conta.email &&
            senha === conta.senha
        ) {

            localStorage.setItem(
                "hboFlixLogado",
                "true"
            );

            window.location.href = "home.html";

        } else {

            error.textContent =
                "E-mail ou senha incorretos.";

            error.style.display = "block";
        }
    }

</script>

</body>
</html>
