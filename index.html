<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HBO FLIX - Entrar</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.85)),
        #111;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

.box {
    width: 100%;
    max-width: 420px;
    padding: 35px;
    background: rgba(20,20,20,.95);
    border-radius: 8px;
}

.logo {
    text-align: center;
    color: #e50914;
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 30px;
}

h1 {
    font-size: 28px;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 15px;
    margin-bottom: 14px;
    background: #333;
    border: 1px solid #555;
    border-radius: 4px;
    color: white;
    outline: none;
}

input:focus {
    border-color: white;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 4px;
    background: #e50914;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #f6121d;
}

.switch {
    margin-top: 20px;
    color: #aaa;
    text-align: center;
}

.switch span {
    color: white;
    cursor: pointer;
}

.error {
    color: #ff5c5c;
    margin-bottom: 15px;
    display: none;
}

.success {
    color: #4ade80;
    margin-bottom: 15px;
    display: none;
}

#cadastro {
    display: none;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">HBO FLIX</div>

    <!-- LOGIN -->
    <div id="login">

        <h1>Entrar</h1>

        <div id="loginError" class="error"></div>

        <input
            id="loginEmail"
            type="email"
            placeholder="E-mail"
        >

        <input
            id="loginSenha"
            type="password"
            placeholder="Senha"
        >

        <button onclick="entrar()">
            Entrar
        </button>

        <div class="switch">
            Não possui conta?
            <span onclick="mostrarCadastro()">
                Criar conta
            </span>
        </div>

    </div>


    <!-- CADASTRO -->
    <div id="cadastro">

        <h1>Criar conta</h1>

        <div id="cadastroError" class="error"></div>
        <div id="cadastroSuccess" class="success"></div>

        <input
            id="nome"
            type="text"
            placeholder="Seu nome"
        >

        <input
            id="cadastroEmail"
            type="email"
            placeholder="E-mail"
        >

        <input
            id="cadastroSenha"
            type="password"
            placeholder="Senha"
        >

        <button onclick="cadastrar()">
            Criar conta
        </button>

        <div class="switch">
            Já possui conta?
            <span onclick="mostrarLogin()">
                Entrar
            </span>
        </div>

    </div>

</div>


<script>

function mostrarCadastro() {

    document.getElementById("login").style.display = "none";

    document.getElementById("cadastro").style.display = "block";

}


function mostrarLogin() {

    document.getElementById("cadastro").style.display = "none";

    document.getElementById("login").style.display = "block";

}


function cadastrar() {

    const nome =
        document.getElementById("nome").value.trim();

    const email =
        document.getElementById("cadastroEmail").value.trim();

    const senha =
        document.getElementById("cadastroSenha").value;


    const error =
        document.getElementById("cadastroError");

    const success =
        document.getElementById("cadastroSuccess");


    error.style.display = "none";
    success.style.display = "none";


    if (!nome || !email || !senha) {

        error.textContent =
            "Preencha todos os campos.";

        error.style.display = "block";

        return;
    }


    if (senha.length < 4) {

        error.textContent =
            "A senha precisa ter pelo menos 4 caracteres.";

        error.style.display = "block";

        return;
    }


    const conta = {
        nome: nome,
        email: email,
        senha: senha
    };


    localStorage.setItem(
        "hboFlixConta",
        JSON.stringify(conta)
    );


    localStorage.setItem(
        "hboFlixLogado",
        "true"
    );


    success.textContent =
        "Conta criada! Entrando...";

    success.style.display = "block";


    setTimeout(function() {

        window.location.href = "home.html";

    }, 700);

}


function entrar() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const senha =
        document.getElementById("loginSenha").value;


    const error =
        document.getElementById("loginError");


    error.style.display = "none";


    const contaSalva =
        localStorage.getItem("hboFlixConta");


    if (!contaSalva) {

        error.textContent =
            "Nenhuma conta foi criada neste navegador.";

        error.style.display = "block";

        return;
    }


    const conta =
        JSON.parse(contaSalva);


    if (
        email === conta.email &&
        senha === conta.senha
    ) {

        localStorage.setItem(
            "hboFlixLogado",
            "true"
        );

        window.location.href = "home.html";

    } else {

        error.textContent =
            "E-mail ou senha incorretos.";

        error.style.display = "block";

    }

}

</script>

</body>
</html>
