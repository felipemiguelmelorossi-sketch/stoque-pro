<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EstoquePRO — Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #18233d 0%,
                    #080b13 45%,
                    #05060a 100%
                );
            color: #ffffff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            font-size: 27px;
            font-weight: 900;
            box-shadow: 0 15px 40px rgba(37, 99, 235, 0.3);
        }

        .logo h1 {
            font-size: 30px;
            letter-spacing: -1px;
        }

        .logo span {
            color: #60a5fa;
        }

        .logo p {
            margin-top: 8px;
            color: #9ca3af;
            font-size: 14px;
        }

        .card {
            background: rgba(15, 19, 30, 0.94);
            border: 1px solid #222a3a;
            border-radius: 22px;
            padding: 30px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255,255,255,0.03);
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 5px;
            background: #090c14;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .tab {
            border: none;
            padding: 12px;
            border-radius: 9px;
            background: transparent;
            color: #8f98aa;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s;
        }

        .tab.active {
            background: #1d4ed8;
            color: white;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form h2 {
            font-size: 22px;
            margin-bottom: 7px;
        }

        .form-description {
            color: #8f98aa;
            font-size: 14px;
            margin-bottom: 23px;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: #d5d9e2;
            font-size: 13px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #293246;
            border-radius: 11px;
            outline: none;
            background: #0a0e17;
            color: white;
            font-size: 14px;
            transition: 0.2s;
        }

        .field input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        .field input::placeholder {
            color: #596274;
        }

        .button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 11px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        .button:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
        }

        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: #86efac;
        }

        .footer {
            text-align: center;
            color: #626b7c;
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 23px;
            }

            .logo h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            <div class="logo-icon">E</div>

            <h1>Estoque<span>PRO</span></h1>

            <p>Controle seu estoque de forma simples.</p>
        </div>

        <section class="card">

            <div class="tabs">
                <button
                    class="tab active"
                    id="loginTab"
                    onclick="mostrarFormulario('login')"
                >
                    Entrar
                </button>

                <button
                    class="tab"
                    id="cadastroTab"
                    onclick="mostrarFormulario('cadastro')"
                >
                    Criar conta
                </button>
            </div>

            <div
                id="message"
                class="message"
            ></div>

            <!-- LOGIN -->

            <form
                id="loginForm"
                class="form active"
                onsubmit="fazerLogin(event)"
            >

                <h2>Bem-vindo de volta</h2>

                <p class="form-description">
                    Entre na sua conta do EstoquePRO.
                </p>

                <div class="field">
                    <label for="loginEmail">
                        E-mail
                    </label>

                    <input
                        id="loginEmail"
                        type="email"
                        placeholder="voce@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="field">
                    <label for="loginSenha">
                        Senha
                    </label>

                    <input
                        id="loginSenha"
                        type="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    class="button"
                    type="submit"
                >
                    Entrar no EstoquePRO
                </button>

            </form>

            <!-- CADASTRO -->

            <form
                id="cadastroForm"
                class="form"
                onsubmit="criarConta(event)"
            >

                <h2>Crie sua conta</h2>

                <p class="form-description">
                    Comece a organizar seu estoque gratuitamente.
                </p>

                <div class="field">
                    <label for="cadastroNome">
                        Seu nome
                    </label>

                    <input
                        id="cadastroNome"
                        type="text"
                        placeholder="Ex.: João Silva"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="field">
                    <label for="cadastroEmail">
                        E-mail
                    </label>

                    <input
                        id="cadastroEmail"
                        type="email"
                        placeholder="voce@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="field">
                    <label for="cadastroSenha">
                        Senha
                    </label>

                    <input
                        id="cadastroSenha"
                        type="password"
                        placeholder="Mínimo de 6 caracteres"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="field">
                    <label for="cadastroSenhaConfirmacao">
                        Confirmar senha
                    </label>

                    <input
                        id="cadastroSenhaConfirmacao"
                        type="password"
                        placeholder="Digite a senha novamente"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    class="button"
                    type="submit"
                >
                    Criar minha conta
                </button>

            </form>

        </section>

        <div class="footer">
            EstoquePRO © 2026 — Controle de estoque simplificado
        </div>

    </main>

    <script>

        const CHAVE_CONTA = "estoqueProConta";
        const CHAVE_LOGIN = "estoqueProLogado";

        function mostrarFormulario(tipo) {

            const loginForm =
                document.getElementById("loginForm");

            const cadastroForm =
                document.getElementById("cadastroForm");

            const loginTab =
                document.getElementById("loginTab");

            const cadastroTab =
                document.getElementById("cadastroTab");

            esconderMensagem();

            if (tipo === "login") {

                loginForm.classList.add("active");
                cadastroForm.classList.remove("active");

                loginTab.classList.add("active");
                cadastroTab.classList.remove("active");

            } else {

                loginForm.classList.remove("active");
                cadastroForm.classList.add("active");

                loginTab.classList.remove("active");
                cadastroTab.classList.add("active");
            }
        }

        function mostrarMensagem(texto, tipo) {

            const message =
                document.getElementById("message");

            message.textContent = texto;

            message.className =
                "message " + tipo;
        }

        function esconderMensagem() {

            const message =
                document.getElementById("message");

            message.textContent = "";

            message.className = "message";
        }

        function criarConta(event) {

            event.preventDefault();

            const nome =
                document.getElementById("cadastroNome")
                .value
                .trim();

            const email =
                document.getElementById("cadastroEmail")
                .value
                .trim()
                .toLowerCase();

            const senha =
                document.getElementById("cadastroSenha")
                .value;

            const confirmacao =
                document.getElementById(
                    "cadastroSenhaConfirmacao"
                ).value;

            if (senha.length < 6) {

                mostrarMensagem(
                    "A senha precisa ter pelo menos 6 caracteres.",
                    "error"
                );

                return;
            }

            if (senha !== confirmacao) {

                mostrarMensagem(
                    "As senhas não são iguais.",
                    "error"
                );

                return;
            }

            const contaExistente =
                localStorage.getItem(CHAVE_CONTA);

            if (contaExistente) {

                const conta =
                    JSON.parse(contaExistente);

                if (conta.email === email) {

                    mostrarMensagem(
                        "Já existe uma conta com esse e-mail.",
                        "error"
                    );

                    return;
                }
            }

            const conta = {
                nome: nome,
                email: email,
                senha: senha
            };

            localStorage.setItem(
                CHAVE_CONTA,
                JSON.stringify(conta)
            );

            localStorage.setItem(
                CHAVE_LOGIN,
                "true"
            );

            mostrarMensagem(
                "Conta criada! Entrando...",
                "success"
            );

            setTimeout(() => {

                window.location.href = "dashboard.html";

            }, 700);
        }

        function fazerLogin(event) {

            event.preventDefault();

            const email =
                document.getElementById("loginEmail")
                .value
                .trim()
                .toLowerCase();

            const senha =
                document.getElementById("loginSenha")
                .value;

            const contaSalva =
                localStorage.getItem(CHAVE_CONTA);

            if (!contaSalva) {

                mostrarMensagem(
                    "Nenhuma conta encontrada. Crie uma conta primeiro.",
                    "error"
                );

                return;
            }

            const conta =
                JSON.parse(contaSalva);

            if (
                conta.email !== email ||
                conta.senha !== senha
            ) {

                mostrarMensagem(
                    "E-mail ou senha incorretos.",
                    "error"
                );

                return;
            }

            localStorage.setItem(
                CHAVE_LOGIN,
                "true"
            );

            mostrarMensagem(
                "Login realizado! Entrando...",
                "success"
            );

            setTimeout(() => {

                window.location.href = "dashboard.html";

            }, 700);
        }

        // Se já estiver logado,
        // vai direto para o painel.

        if (
            localStorage.getItem(CHAVE_LOGIN) === "true"
        ) {

            window.location.href = "dashboard.html";
        }

    </script>

</body>
</html>
