<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EstoquePRO — Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #163b63 0%, transparent 35%),
        radial-gradient(circle at bottom right, #0d2a47 0%, transparent 35%),
        #050b12;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1683ff, #0056b3);
      box-shadow: 0 15px 40px rgba(0, 126, 255, .25);
      font-size: 30px;
      font-weight: bold;
    }

    .logo h1 {
      font-size: 28px;
      letter-spacing: -1px;
    }

    .logo h1 span {
      color: #1683ff;
    }

    .logo p {
      color: #8d9aaa;
      margin-top: 7px;
      font-size: 14px;
    }

    .card {
      background: rgba(12, 20, 30, .94);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, .45);
      backdrop-filter: blur(15px);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      background: #080f17;
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .tab {
      border: none;
      background: transparent;
      color: #7e8b9b;
      padding: 12px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .tab.active {
      background: #1683ff;
      color: #fff;
    }

    h2 {
      font-size: 23px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #8290a0;
      font-size: 14px;
      margin-bottom: 23px;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #b6c0cc;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 11px;
      border: 1px solid #263545;
      outline: none;
      background: #080f17;
      color: #fff;
      font-size: 14px;
      transition: .2s;
    }

    input:focus {
      border-color: #1683ff;
      box-shadow: 0 0 0 3px rgba(22, 131, 255, .12);
    }

    input::placeholder {
      color: #536170;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 11px;
      padding: 14px;
      background: linear-gradient(135deg, #1683ff, #0066cc);
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: .2s;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(22, 131, 255, .22);
    }

    .button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(239, 68, 68, .1);
      border: 1px solid rgba(239, 68, 68, .25);
      color: #ff8b8b;
    }

    .message.success {
      background: rgba(34, 197, 94, .1);
      border: 1px solid rgba(34, 197, 94, .25);
      color: #76e3a0;
    }

    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 18px;
    }

    .forgot button {
      border: none;
      background: none;
      color: #1683ff;
      cursor: pointer;
      font-size: 12px;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #596675;
      font-size: 12px;
    }

    .security {
      display: flex;
      justify-content: center;
      gap: 7px;
      align-items: center;
      margin-top: 17px;
      color: #667484;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 23px;
      }

      .logo h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <div class="logo-icon">E</div>
    <h1>Estoque<span>PRO</span></h1>
    <p>Gestão profissional do seu estoque</p>
  </div>

  <div class="card">

    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="mostrarFormulario('login')">
        Entrar
      </button>

      <button class="tab" id="cadastroTab" onclick="mostrarFormulario('cadastro')">
        Criar conta
      </button>
    </div>

    <div id="message" class="message"></div>

    <!-- LOGIN -->

    <form id="loginForm" class="form active" onsubmit="entrar(event)">

      <h2>Bem-vindo de volta</h2>

      <p class="subtitle">
        Entre na sua conta para continuar.
      </p>

      <div class="field">
        <label for="loginEmail">E-mail</label>

        <input
          id="loginEmail"
          type="email"
          placeholder="seu@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="loginSenha">Senha</label>

        <input
          id="loginSenha"
          type="password"
          placeholder="Sua senha"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="forgot">
        <button type="button" onclick="recuperarSenha()">
          Esqueci minha senha
        </button>
      </div>

      <button id="loginButton" class="button" type="submit">
        Entrar
      </button>

    </form>

    <!-- CADASTRO -->

    <form id="cadastroForm" class="form" onsubmit="cadastrar(event)">

      <h2>Crie sua conta</h2>

      <p class="subtitle">
        Comece a controlar seu estoque gratuitamente.
      </p>

      <div class="field">
        <label for="nome">Seu nome</label>

        <input
          id="nome"
          type="text"
          placeholder="Digite seu nome"
          autocomplete="name"
          required
        >
      </div>

      <div class="field">
        <label for="cadastroEmail">E-mail</label>

        <input
          id="cadastroEmail"
          type="email"
          placeholder="seu@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="cadastroSenha">Senha</label>

        <input
          id="cadastroSenha"
          type="password"
          placeholder="Mínimo de 6 caracteres"
          minlength="6"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="field">
        <label for="confirmarSenha">Confirmar senha</label>

        <input
          id="confirmarSenha"
          type="password"
          placeholder="Digite a senha novamente"
          minlength="6"
          autocomplete="new-password"
          required
        >
      </div>

      <button id="cadastroButton" class="button" type="submit">
        Criar minha conta
      </button>

    </form>

    <div class="security">
      🔒 Seus dados são protegidos pelo Supabase
    </div>

  </div>

  <div class="footer">
    © 2026 EstoquePRO
  </div>

</div>

<script>

  /*
  =====================================================
  CONFIGURAÇÃO SUPABASE
  =====================================================
  */

  let clienteSupabase = null;

  function iniciarSupabase() {

    if (typeof window.supabase === "undefined") {
      mostrarMensagem(
        "A biblioteca do Supabase não carregou. Atualize a página e tente novamente.",
        "error"
      );
      return false;
    }

    if (
      typeof SUPABASE_URL === "undefined" ||
      typeof SUPABASE_ANON_KEY === "undefined"
    ) {
      mostrarMensagem(
        "O arquivo config.js não foi carregado corretamente.",
        "error"
      );
      return false;
    }

    let url = String(SUPABASE_URL).trim();

    let chave = String(SUPABASE_ANON_KEY).trim();

    /*
      Remove aspas extras caso tenham sido copiadas
      acidentalmente para o config.js.
    */

    url = url.replace(/^["']|["']$/g, "");
    chave = chave.replace(/^["']|["']$/g, "");

    /*
      Remove barras extras no final da URL.
    */

    url = url.replace(/\/+$/, "");

    /*
      A URL precisa ser uma URL HTTP/HTTPS válida.
    */

    try {

      const urlValidada = new URL(url);

      if (
        urlValidada.protocol !== "https:" &&
        urlValidada.protocol !== "http:"
      ) {
        throw new Error("Protocolo inválido.");
      }

      /*
        Usa somente a origem do projeto.
        Isso evita problemas caso tenha sido colado
        algum caminho extra depois do .supabase.co
      */

      url = urlValidada.origin;

    } catch (erro) {

      mostrarMensagem(
        "A URL do Supabase no config.js é inválida.",
        "error"
      );

      console.error("SUPABASE_URL inválida:", url);

      return false;
    }

    if (!chave || chave.length < 20) {

      mostrarMensagem(
        "A chave pública do Supabase no config.js parece estar incorreta.",
        "error"
      );

      return false;
    }

    try {

      clienteSupabase =
        window.supabase.createClient(
          url,
          chave
        );

      console.log("Supabase conectado:", url);

      return true;

    } catch (erro) {

      console.error(
        "Erro ao criar cliente Supabase:",
        erro
      );

      mostrarMensagem(
        "Não foi possível iniciar o Supabase.",
        "error"
      );

      return false;
    }
  }


  /*
  =====================================================
  INICIAR
  =====================================================
  */

  const supabasePronto = iniciarSupabase();

  if (supabasePronto) {
    verificarSessao();
  }


  /*
  =====================================================
  VERIFICAR SESSÃO
  =====================================================
  */

  async function verificarSessao() {

    try {

      const resultado =
        await clienteSupabase.auth.getSession();

      if (resultado.error) {
        console.error(resultado.error);
        return;
      }

      const session =
        resultado.data.session;

      if (session) {

        window.location.href =
          "dashboard.html";
      }

    } catch (erro) {

      console.error(
        "Erro ao verificar sessão:",
        erro
      );
    }
  }


  /*
  =====================================================
  FORMULÁRIOS
  =====================================================
  */

  function mostrarFormulario(tipo) {

    const loginForm =
      document.getElementById("loginForm");

    const cadastroForm =
      document.getElementById("cadastroForm");

    const loginTab =
      document.getElementById("loginTab");

    const cadastroTab =
      document.getElementById("cadastroTab");

    limparMensagem();

    if (tipo === "login") {

      loginForm.classList.add("active");
      cadastroForm.classList.remove("active");

      loginTab.classList.add("active");
      cadastroTab.classList.remove("active");

    } else {

      cadastroForm.classList.add("active");
      loginForm.classList.remove("active");

      cadastroTab.classList.add("active");
      loginTab.classList.remove("active");
    }
  }


  /*
  =====================================================
  CADASTRO
  =====================================================
  */

  async function cadastrar(event) {

    event.preventDefault();

    limparMensagem();

    if (!clienteSupabase) {
      mostrarMensagem(
        "Supabase não está conectado.",
        "error"
      );
      return;
    }

    const nome =
      document.getElementById("nome").value.trim();

    const email =
      document
        .getElementById("cadastroEmail")
        .value
        .trim();

    const senha =
      document.getElementById("cadastroSenha").value;

    const confirmarSenha =
      document
        .getElementById("confirmarSenha")
        .value;

    const botao =
      document.getElementById("cadastroButton");

    if (senha !== confirmarSenha) {

      mostrarMensagem(
        "As senhas não são iguais.",
        "error"
      );

      return;
    }

    if (senha.length < 6) {

      mostrarMensagem(
        "A senha precisa ter pelo menos 6 caracteres.",
        "error"
      );

      return;
    }

    botao.disabled = true;
    botao.textContent = "Criando conta...";

    try {

      const resultado =
        await clienteSupabase.auth.signUp({

          email: email,

          password: senha,

          options: {
            data: {
              nome: nome
            }
          }

        });

      if (resultado.error) {
        throw resultado.error;
      }

      const data = resultado.data;

      if (data.session) {

        mostrarMensagem(
          "Conta criada com sucesso! Entrando...",
          "success"
        );

        setTimeout(() => {
          window.location.href =
            "dashboard.html";
        }, 700);

      } else {

        mostrarMensagem(
          "Conta criada! Verifique seu e-mail para confirmar o cadastro.",
          "success"
        );

        document
          .getElementById("cadastroForm")
          .reset();
      }

    } catch (erro) {

      console.error(
        "Erro no cadastro:",
        erro
      );

      mostrarMensagem(
        traduzirErro(erro.message),
        "error"
      );

    } finally {

      botao.disabled = false;
      botao.textContent =
        "Criar minha conta";
    }
  }


  /*
  =====================================================
  LOGIN
  =====================================================
  */

  async function entrar(event) {

    event.preventDefault();

    limparMensagem();

    if (!clienteSupabase) {

      mostrarMensagem(
        "Supabase não está conectado. Verifique o config.js.",
        "error"
      );

      return;
    }

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const senha =
      document
        .getElementById("loginSenha")
        .value;

    const botao =
      document.getElementById("loginButton");

    botao.disabled = true;
    botao.textContent = "Entrando...";

    try {

      const resultado =
        await clienteSupabase.auth.signInWithPassword({

          email: email,

          password: senha

        });

      if (resultado.error) {
        throw resultado.error;
      }

      const data =
        resultado.data;

      if (!data.session) {

        throw new Error(
          "A sessão não foi criada."
        );
      }

      mostrarMensagem(
        "Login realizado com sucesso!",
        "success"
      );

      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      }, 500);

    } catch (erro) {

      console.error(
        "ERRO COMPLETO DO LOGIN:",
        erro
      );

      mostrarMensagem(
        traduzirErro(erro.message),
        "error"
      );

    } finally {

      botao.disabled = false;
      botao.textContent = "Entrar";
    }
  }


  /*
  =====================================================
  RECUPERAR SENHA
  =====================================================
  */

  async function recuperarSenha() {

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    if (!email) {

      mostrarMensagem(
        "Digite seu e-mail no campo acima primeiro.",
        "error"
      );

      return;
    }

    if (!clienteSupabase) {

      mostrarMensagem(
        "Supabase não está conectado.",
        "error"
      );

      return;
    }

    try {

      const resultado =
        await clienteSupabase.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              window.location.origin +
              window.location.pathname
          }
        );

      if (resultado.error) {
        throw resultado.error;
      }

      mostrarMensagem(
        "Se esse e-mail estiver cadastrado, enviaremos as instruções para redefinir sua senha.",
        "success"
      );

    } catch (erro) {

      console.error(
        "Erro ao recuperar senha:",
        erro
      );

      mostrarMensagem(
        traduzirErro(erro.message),
        "error"
      );
    }
  }


  /*
  =====================================================
  MENSAGENS
  =====================================================
  */

  function mostrarMensagem(texto, tipo) {

    const elemento =
      document.getElementById("message");

    elemento.textContent =
      texto;

    elemento.className =
      "message show " + tipo;
  }


  function limparMensagem() {

    const elemento =
      document.getElementById("message");

    elemento.textContent = "";

    elemento.className =
      "message";
  }


  /*
  =====================================================
  TRADUZIR ERROS
  =====================================================
  */

  function traduzirErro(mensagem) {

    if (!mensagem) {
      return "Ocorreu um erro. Tente novamente.";
    }

    const texto =
      String(mensagem).toLowerCase();

    if (
      texto.includes(
        "invalid login credentials"
      )
    ) {
      return "E-mail ou senha incorretos.";
    }

    if (
      texto.includes(
        "email not confirmed"
      )
    ) {
      return "Seu e-mail ainda não foi confirmado.";
    }

    if (
      texto.includes(
        "user already registered"
      )
    ) {
      return "Este e-mail já possui uma conta.";
    }

    if (
      texto.includes(
        "password should be at least"
      )
    ) {
      return "A senha precisa ter pelo menos 6 caracteres.";
    }

    if (
      texto.includes(
        "rate limit"
      )
    ) {
      return "Muitas tentativas. Aguarde alguns minutos.";
    }

    if (
      texto.includes("invalid") &&
      texto.includes("email")
    ) {
      return "Digite um e-mail válido.";
    }

    if (
      texto.includes(
        "invalid path specified in request url"
      )
    ) {
      return "A conexão com o Supabase está usando uma URL inválida. Verifique o Project URL no config.js.";
    }

    if (
      texto.includes(
        "failed to fetch"
      )
    ) {
      return "Não foi possível conectar ao Supabase.";
    }

    return mensagem;
  }

</script>

</body>
</html>
