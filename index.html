<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HBO Flix — Teste Grátis</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #24133b 0%, #080808 45%),
                #080808;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: rgba(17,17,17,.96);
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 25px 80px rgba(0,0,0,.65);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -2px;
            color: #a879ff;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 28px;

        .free-badge {
            width: fit-content;
            margin: 0 auto 22px;
            padding: 7px 13px;
            border-radius: 30px;
            background: rgba(139,92,246,.14);
            border: 1px solid rgba(167,127,255,.35);
            color: #c7a9ff;
            font-size: 12px;
            font-weight: bold;
        }

        .tabs {
            display: flex;
            gap: 4px;
            background: #191919;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 25px;

        .tab {
            flex: 1;
            border: 0;
            background: transparent;
            color: #888;
            padding: 11px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;

        .tab.active {
            background: #2a2a2a;

        .form {
            display: none;
        }

        .form.active {
            display: block;

        label {
            display: block;

            font-size: 13px;

        input {
            width: 100%;

</head>

<body>

<div class="container">

    <div class="logo">
        HBO FLIX
    </div>

    <div class="subtitle">
        Filmes e séries em um só lugar.
    </div>

    <div class="free-badge">
        ✨ TESTE GRÁTIS
    </div>

    <div class="tabs">

        <button
            class="tab active"
            id="loginTab"
            onclick="showLogin()"
        >
            Entrar
        </button>

        <button
            class="tab"
            id="registerTab"
            onclick="showRegister()"
        >
            Criar conta
        </button>

    </div>


    <!-- LOGIN -->

    <div
        class="form active"
        id="loginForm"
    >

        <label for="loginEmail">
            E-mail
        </label>

        <input
            id="loginEmail"
            type="email"
            placeholder="seu@email.com"
            autocomplete="email"
        >

        <label for="loginPassword">
            Senha
        </label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Sua senha"
            autocomplete="current-password"
        >

        <div
            class="error"
            id="loginError"
        ></div>

        <button
            class="main-button"
            onclick="login()"
        >
            Entrar gratuitamente
        </button>

    </div>


    <!-- CADASTRO -->

    <div
        class="form"
        id="registerForm"
    >

        <label for="registerName">
            Nome
        </label>

        <input
            id="registerName"
            type="text"
            placeholder="Seu nome"
            autocomplete="name"
        >

        <label for="registerEmail">
            E-mail
        </label>

        <input
            id="registerEmail"
            type="email"
            placeholder="seu@email.com"
            autocomplete="email"
        >

        <label for="registerPassword">
            Senha
        </label>

        <input
            id="registerPassword"
            type="password"
            placeholder="Crie uma senha"
            autocomplete="new-password"
        >

        <div
            class="error"
            id="registerError"
        ></div>

        <div
            class="success"
            id="registerSuccess"
        ></div>

        <button
            class="main-button"
            onclick="createAccount()"
        >
            Criar conta grátis
        </button>

    </div>


    <div class="info">
        Conta gratuita para testes do HBO Flix.
        Nenhum pagamento é necessário.
    </div>

</div>


<script>

    /* ================================
       TROCAR ENTRE LOGIN E CADASTRO
    ================================= */

    function showLogin() {

        document
            .getElementById("loginForm")
            .classList.add("active");

        document
            .getElementById("registerForm")
            .classList.remove("active");

        document
            .getElementById("loginTab")
            .classList.add("active");

        document
            .getElementById("registerTab")
            .classList.remove("active");
    }


    function showRegister() {

        document
            .getElementById("registerForm")
            .classList.add("active");

        document
            .getElementById("loginForm")
            .classList.remove("active");

        document
            .getElementById("registerTab")
            .classList.add("active");

        document
            .getElementById("loginTab")
            .classList.remove("active");
    }


    /* ================================
       CRIAR CONTA
    ================================= */

    function createAccount() {

        const nome =
            document
                .getElementById("registerName")
                .value
                .trim();

        const email =
            document
                .getElementById("registerEmail")
                .value
                .trim()
                .toLowerCase();

        const senha =
            document
                .getElementById("registerPassword")
                .value;

        const error =
            document.getElementById(
                "registerError"
            );

        const success =
            document.getElementById(
                "registerSuccess"
            );

        error.style.display = "none";
        success.style.display = "none";


        if (!nome || !email || !senha) {

            error.textContent =
                "Preencha todos os campos.";

            error.style.display = "block";

            return;
        }


        if (!email.includes("@")) {

            error.textContent =
                "Digite um e-mail válido.";

            error.style.display = "block";

            return;
        }


        if (senha.length < 6) {

            error.textContent =
                "A senha precisa ter pelo menos 6 caracteres.";

            error.style.display = "block";

            return;
        }


        /*
         * Conta salva localmente apenas
         * para o ambiente de testes.
         */

        const conta = {
            nome: nome,
            email: email,
            senha: senha
        };


        localStorage.setItem(
            "hboFlixConta",
            JSON.stringify(conta)
        );


        localStorage.setItem(
            "hboFlixLogado",
            "true"
        );


        success.textContent =
            "Conta criada! Abrindo o HBO Flix...";

        success.style.display = "block";


        setTimeout(function() {

            window.location.href =
                "home.html";

        }, 700);
    }


    /* ================================
       LOGIN
    ================================= */

    function login() {

        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim()
                .toLowerCase();

        const senha =
            document
                .getElementById("loginPassword")
                .value;

        const error =
            document.getElementById(
                "loginError"
            );

        error.style.display = "none";


        const contaSalva =
            localStorage.getItem(
                "hboFlixConta"
            );


        if (!contaSalva) {

            error.textContent =
                "Você ainda não possui uma conta neste navegador.";

            error.style.display = "block";

            return;
        }


        let conta;


        try {

            conta =
                JSON.parse(contaSalva);

        } catch {

            error.textContent =
                "Não foi possível carregar sua conta.";

            error.style.display = "block";

            return;
        }


        if (
            email === conta.email &&
            senha === conta.senha
        ) {

            localStorage.setItem(
                "hboFlixLogado",
                "true"
            );


            window.location.href =
                "home.html";

        } else {

            error.textContent =
                "E-mail ou senha incorretos.";

            error.style.display = "block";
        }
    }


    /* ================================
       ENTER NOS CAMPOS
    ================================= */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                document
                    .getElementById("loginForm")
                    .classList.contains("active")
            ) {

                login();
            }

        }
    );

</script>

</body>
</html>
