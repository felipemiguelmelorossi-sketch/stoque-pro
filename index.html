<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EstoquePRO — Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#07111f;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    font-size:36px;
    letter-spacing:-1px;
}

.logo span{
    color:#3b82f6;
}

.logo p{
    color:#94a3b8;
    margin-top:8px;
}

.card{
    background:#0d1b2a;
    border:1px solid #1e334d;
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.tabs{
    display:flex;
    background:#081522;
    border-radius:12px;
    padding:4px;
    margin-bottom:25px;
}

.tabs button{
    width:50%;
    padding:12px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#94a3b8;
    cursor:pointer;
    font-weight:bold;
}

.tabs button.active{
    background:#2563eb;
    color:white;
}

.form{
    display:none;
}

.form.active{
    display:block;
}

label{
    display:block;
    margin:15px 0 7px;
    color:#cbd5e1;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #29415d;
    background:#081522;
    color:white;
    outline:none;
}

input:focus{
    border-color:#3b82f6;
}

.submit{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.submit:hover{
    background:#1d4ed8;
}

.message{
    margin-top:15px;
    text-align:center;
    color:#f87171;
    font-size:14px;
}

.info{
    margin-top:22px;
    padding:14px;
    background:#081522;
    border-radius:10px;
    color:#94a3b8;
    font-size:13px;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>Estoque<span>PRO</span></h1>
        <p>Gestão profissional de estoque</p>
    </div>

    <div class="card">

        <div class="tabs">
            <button id="loginTab" class="active" onclick="showForm('login')">
                Entrar
            </button>

            <button id="registerTab" onclick="showForm('register')">
                Criar conta
            </button>
        </div>

        <!-- LOGIN -->
        <form id="loginForm" class="form active">

            <label>E-mail</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="seu@email.com"
                required
            >

            <label>Senha</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Sua senha"
                required
            >

            <button class="submit" type="submit">
                Entrar
            </button>

            <div id="loginMessage" class="message"></div>

        </form>

        <!-- CADASTRO -->
        <form id="registerForm" class="form">

            <label>Nome</label>
            <input
                type="text"
                id="registerName"
                placeholder="Seu nome"
                required
            >

            <label>E-mail</label>
            <input
                type="email"
                id="registerEmail"
                placeholder="seu@email.com"
                required
            >

            <label>Senha</label>
            <input
                type="password"
                id="registerPassword"
                placeholder="Crie uma senha"
                minlength="4"
                required
            >

            <button class="submit" type="submit">
                Criar conta
            </button>

            <div id="registerMessage" class="message"></div>

        </form>

        <div class="info">
            🆓 Sua conta começa no plano gratuito.
            <br><br>
            🚀 Você poderá fazer upgrade para o
            <strong>EstoquePRO PRO</strong>.
        </div>

    </div>

</div>

<script>

function showForm(type){

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    if(type === "login"){

        loginForm.classList.add("active");
        registerForm.classList.remove("active");

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

    }else{

        registerForm.classList.add("active");
        loginForm.classList.remove("active");

        registerTab.classList.add("active");
        loginTab.classList.remove("active");

    }
}

function getConta(){
    return JSON.parse(
        localStorage.getItem("estoqueProConta") || "null"
    );
}

document.getElementById("registerForm").addEventListener(
    "submit",
    function(e){

        e.preventDefault();

        const nome =
            document.getElementById("registerName").value.trim();

        const email =
            document.getElementById("registerEmail").value.trim().toLowerCase();

        const senha =
            document.getElementById("registerPassword").value;

        const message =
            document.getElementById("registerMessage");

        if(!nome || !email || !senha){

            message.textContent = "Preencha todos os campos.";
            return;
        }

        const contaExistente = getConta();

        if(contaExistente &&
           contaExistente.email === email){

            message.textContent =
                "Este e-mail já possui uma conta.";

            return;
        }

        const conta = {
            nome: nome,
            email: email,
            senha: senha,
            plano: "free",
            criadoEm: new Date().toISOString()
        };

        localStorage.setItem(
            "estoqueProConta",
            JSON.stringify(conta)
        );

        localStorage.setItem(
            "estoqueProProdutos",
            "[]"
        );

        localStorage.setItem(
            "estoqueProMovimentacoes",
            "[]"
        );

        message.style.color = "#4ade80";
        message.textContent =
            "Conta criada! Entrando...";

        setTimeout(function(){

            localStorage.setItem(
                "estoqueProLogado",
                "true"
            );

            window.location.href = "dashboard.html";

        },800);

    }
);

document.getElementById("loginForm").addEventListener(
    "submit",
    function(e){

        e.preventDefault();

        const email =
            document.getElementById("loginEmail")
            .value.trim()
            .toLowerCase();

        const senha =
            document.getElementById("loginPassword")
            .value;

        const message =
            document.getElementById("loginMessage");

        const conta = getConta();

        if(!conta){

            message.textContent =
                "Nenhuma conta encontrada. Crie uma conta primeiro.";

            return;
        }

        if(
            conta.email !== email ||
            conta.senha !== senha
        ){

            message.textContent =
                "E-mail ou senha incorretos.";

            return;
        }

        localStorage.setItem(
            "estoqueProLogado",
            "true"
        );

        message.style.color = "#4ade80";
        message.textContent =
            "Login realizado!";

        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        },500);

    }
);

</script>

</body>
</html>
