<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EstoquePRO — Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#07111f;
    color:white;
    min-height:100vh;
}

.layout{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:250px;
    background:#0b1726;
    border-right:1px solid #1c3148;
    padding:25px 15px;
}

.logo{
    padding:0 12px 30px;
}

.logo h2{
    font-size:25px;
}

.logo span{
    color:#3b82f6;
}

.menu button{
    width:100%;
    padding:13px;
    margin:4px 0;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#94a3b8;
    text-align:left;
    cursor:pointer;
}

.menu button:hover,
.menu button.active{
    background:#162b43;
    color:white;
}

.main{
    flex:1;
    padding:30px;
    overflow:auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:30px;
}

.top h1{
    font-size:30px;
}

.user{
    background:#0d1b2a;
    border:1px solid #1e334d;
    padding:10px 14px;
    border-radius:10px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.card{
    background:#0d1b2a;
    border:1px solid #1e334d;
    border-radius:15px;
    padding:20px;
}

.card small{
    color:#94a3b8;
}

.card h2{
    margin-top:10px;
    font-size:28px;
}

.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    margin-top:20px;
}

.panel{
    background:#0d1b2a;
    border:1px solid #1e334d;
    border-radius:15px;
    padding:22px;
}

.panel h3{
    margin-bottom:18px;
}

.pro{
    background:linear-gradient(
        135deg,
        #102d59,
        #0d1b2a
    );
    border-color:#2563eb;
}

.pro p{
    color:#cbd5e1;
    margin:10px 0 18px;
    line-height:1.5;
}

.pro button{
    background:#2563eb;
    color:white;
    border:0;
    padding:12px 18px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.activity{
    color:#94a3b8;
    padding:10px 0;
    border-bottom:1px solid #1c3148;
}

@media(max-width:900px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:650px){

    .sidebar{
        display:none;
    }

    .main{
        padding:18px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .top{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            <h2>Estoque<span>PRO</span></h2>
        </div>

        <div class="menu">

            <button class="active">
                📊 Dashboard
            </button>

            <button onclick="location.href='produtos.html'">
                📦 Produtos
            </button>

            <button onclick="location.href='produtos.html'">
                🔄 Movimentações
            </button>

            <button onclick="alert('Relatórios avançados estarão disponíveis no PRO.')">
                📈 Relatórios
            </button>

            <button onclick="assinarPro()">
                🚀 Assinar PRO
            </button>

            <button onclick="logout()">
                🚪 Sair
            </button>

        </div>

    </aside>

    <main class="main">

        <div class="top">

            <div>
                <h1>Dashboard</h1>
                <p id="welcome" style="color:#94a3b8;margin-top:5px;">
                    Bem-vindo ao EstoquePRO
                </p>
            </div>

            <div class="user" id="userPlan">
                Plano Gratuito
            </div>

        </div>

        <div class="cards">

            <div class="card">
                <small>Produtos</small>
                <h2 id="totalProdutos">0</h2>
            </div>

            <div class="card">
                <small>Itens em estoque</small>
                <h2 id="totalEstoque">0</h2>
            </div>

            <div class="card">
                <small>Estoque baixo</small>
                <h2 id="estoqueBaixo">0</h2>
            </div>

            <div class="card">
                <small>Valor do estoque</small>
                <h2 id="valorEstoque">R$ 0,00</h2>
            </div>

        </div>

        <div class="grid">

            <div class="panel">

                <h3>📦 Resumo do estoque</h3>

                <div id="activities">
                    Nenhuma movimentação registrada.
                </div>

            </div>

            <div class="panel pro">

                <h3>🚀 EstoquePRO PRO</h3>

                <p>
                    Tenha recursos profissionais para controlar
                    seu estoque por apenas <strong>R$ 9,99/mês</strong>.
                </p>

                <button onclick="assinarPro()">
                    Assinar PRO
                </button>

            </div>

        </div>

    </main>

</div>

<script>

if(localStorage.getItem("estoqueProLogado") !== "true"){
    window.location.href = "index.html";
}

const conta =
    JSON.parse(
        localStorage.getItem("estoqueProConta") || "null"
    );

if(!conta){
    window.location.href = "index.html";
}

document.getElementById("welcome").textContent =
    "Olá, " + conta.nome + "!";

document.getElementById("userPlan").textContent =
    conta.plano === "pro"
        ? "🚀 Plano PRO"
        : "🆓 Plano Gratuito";

function carregarDashboard(){

    const produtos =
        JSON.parse(
            localStorage.getItem("estoqueProProdutos") || "[]"
        );

    const movimentos =
        JSON.parse(
            localStorage.getItem("estoqueProMovimentacoes") || "[]"
        );

    document.getElementById("totalProdutos").textContent =
        produtos.length;

    let total = 0;
    let baixo = 0;
    let valor = 0;

    produtos.forEach(p => {

        const quantidade =
            Number(p.quantidade || 0);

        const preco =
            Number(p.preco || 0);

        total += quantidade;
        valor += quantidade * preco;

        if(
            quantidade <=
            Number(p.minimo || 0)
        ){
            baixo++;
        }

    });

    document.getElementById("totalEstoque").textContent =
        total;

    document.getElementById("estoqueBaixo").textContent =
        baixo;

    document.getElementById("valorEstoque").textContent =
        valor.toLocaleString(
            "pt-BR",
            {
                style:"currency",
                currency:"BRL"
            }
        );

    const activity =
        document.getElementById("activities");

    if(movimentos.length === 0){

        activity.textContent =
            "Nenhuma movimentação registrada.";

        return;
    }

    activity.innerHTML =
        movimentos
        .slice(-6)
        .reverse()
        .map(m => `
            <div class="activity">
                ${m.tipo === "entrada" ? "🟢" : "🔴"}
                <strong>${escapeHtml(m.produto)}</strong>
                — ${m.quantidade} unidade(s)
                <br>
                <small>${new Date(m.data).toLocaleString("pt-BR")}</small>
            </div>
        `)
        .join("");

}

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function logout(){

    localStorage.removeItem(
        "estoqueProLogado"
    );

    window.location.href =
        "index.html";
}

function assinarPro(){

    // Depois vamos substituir pelo Payment Link
    // do Stripe do EstoquePRO PRO.

    alert(
        "O checkout do EstoquePRO PRO será conectado aqui."
    );
}

carregarDashboard();

</script>

</body>
</html>
