<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EstoquePRO — Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070a10;
            --sidebar: #0b0f18;
            --card: #101621;
            --card-hover: #141b28;
            --border: #202938;
            --text: #f5f7fb;
            --muted: #8993a5;
            --blue: #2563eb;
            --blue-light: #60a5fa;
            --green: #22c55e;
            --orange: #f59e0b;
            --red: #ef4444;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        button,
        input {
            font-family: inherit;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;

            width: 250px;

            background: var(--sidebar);
            border-right: 1px solid var(--border);

            padding: 24px 16px;

            display: flex;
            flex-direction: column;

            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 0 10px;
            margin-bottom: 35px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            font-size: 20px;
            font-weight: 900;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 900;
        }

        .brand-name span {
            color: var(--blue-light);
        }

        .menu-title {
            padding: 0 12px;
            margin-bottom: 10px;

            color: #596477;
            font-size: 10px;
            font-weight: 800;

            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu button {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 12px;

            border: 0;
            border-radius: 10px;

            padding: 12px;

            background: transparent;
            color: var(--muted);

            cursor: pointer;

            text-align: left;
            font-size: 14px;
            font-weight: 700;

            transition: 0.2s;
        }

        .menu button:hover {
            background: #121925;
            color: white;
        }

        .menu button.active {
            background: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
        }

        .menu-icon {
            width: 20px;
            text-align: center;
            font-size: 17px;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .user-mini {
            border-top: 1px solid var(--border);

            padding: 18px 8px 5px;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #1d4ed8;

            font-size: 14px;
            font-weight: 900;
        }

        .user-info {
            min-width: 0;
            flex: 1;
        }

        .user-info strong {
            display: block;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 13px;
        }

        .user-info span {
            display: block;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: var(--muted);
            font-size: 11px;

            margin-top: 3px;
        }

        .logout {
            border: 0;
            background: transparent;

            color: #6f798b;

            cursor: pointer;

            font-size: 17px;
        }

        .logout:hover {
            color: #f87171;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 250px;
            min-height: 100vh;

            padding: 30px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 28px;
            letter-spacing: -0.7px;
        }

        .page-title p {
            color: var(--muted);
            font-size: 14px;

            margin-top: 7px;
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .top-button {
            border: 1px solid var(--border);

            border-radius: 10px;

            padding: 11px 15px;

            background: var(--card);
            color: #c8ced9;

            cursor: pointer;

            font-size: 13px;
            font-weight: 700;

            transition: 0.2s;
        }

        .top-button:hover {
            background: var(--card-hover);
            border-color: #334155;
            color: white;
        }

        .primary-button {
            border: 0;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;
        }

        .primary-button:hover {
            filter: brightness(1.08);
        }

        /* =========================
           CARDS
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 15px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 15px;

            padding: 20px;

            transition: 0.2s;
        }

        .stat-card:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
        }

        .stat-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .stat-icon {
            width: 36px;
            height: 36px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(37, 99, 235, 0.12);

            font-size: 16px;
        }

        .stat-value {
            margin-top: 15px;

            font-size: 25px;
            font-weight: 900;
        }

        .stat-extra {
            margin-top: 7px;

            color: #6f7a8e;
            font-size: 11px;
        }

        .stat-extra.green {
            color: #4ade80;
        }

        .stat-extra.orange {
            color: #fbbf24;
        }

        .stat-extra.red {
            color: #f87171;
        }

        /* =========================
           CONTENT GRID
        ========================= */

        .content-grid {
            display: grid;

            grid-template-columns:
                minmax(0, 1.5fr)
                minmax(300px, 1fr);

            gap: 20px;
        }

        .panel {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 16px;

            overflow: hidden;
        }

        .panel-header {
            padding: 19px 20px;

            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        .panel-header h2 {
            font-size: 15px;
        }

        .panel-header button {
            border: 0;

            background: transparent;

            color: #60a5fa;

            cursor: pointer;

            font-size: 12px;
            font-weight: 700;
        }

        /* =========================
           STOCK LIST
        ========================= */

        .stock-list {
            padding: 5px 0;
        }

        .stock-item {
            display: flex;
            align-items: center;

            gap: 12px;

            padding: 14px 20px;

            border-bottom: 1px solid
                rgba(32, 41, 56, 0.7);
        }

        .stock-item:last-child {
            border-bottom: 0;
        }

        .product-icon {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #172033;

            font-size: 18px;
        }

        .product-data {
            min-width: 0;
            flex: 1;
        }

        .product-data strong {
            display: block;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 13px;
        }

        .product-data span {
            display: block;

            color: var(--muted);

            font-size: 11px;

            margin-top: 4px;
        }

        .quantity {
            font-size: 13px;
            font-weight: 900;
        }

        .status {
            min-width: 80px;

            text-align: center;

            border-radius: 20px;

            padding: 6px 9px;

            font-size: 10px;
            font-weight: 800;
        }

        .status.ok {
            background: rgba(34,197,94,0.1);
            color: #4ade80;
        }

        .status.low {
            background: rgba(245,158,11,0.1);
            color: #fbbf24;
        }

        .status.empty {
            background: rgba(239,68,68,0.1);
            color: #f87171;
        }

        /* =========================
           ACTIVITY
        ========================= */

        .activity-list {
            padding: 8px 20px;
        }

        .activity {
            display: flex;
            gap: 12px;

            padding: 14px 0;

            border-bottom: 1px solid
                rgba(32, 41, 56, 0.7);
        }

        .activity:last-child {
            border-bottom: 0;
        }

        .activity-dot {
            width: 9px;
            height: 9px;

            margin-top: 5px;

            border-radius: 50%;

            flex-shrink: 0;

            background: var(--blue);
        }

        .activity-dot.green {
            background: var(--green);
        }

        .activity-dot.orange {
            background: var(--orange);
        }

        .activity-text {
            font-size: 12px;
            line-height: 1.5;
        }

        .activity-text strong {
            color: white;
        }

        .activity-time {
            display: block;

            color: #606b7d;

            font-size: 10px;

            margin-top: 4px;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty {
            padding: 45px 20px;

            text-align: center;

            color: var(--muted);
        }

        .empty-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .empty p {
            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================= */

        .mobile-header {
            display: none;
        }

        @media (max-width: 1050px) {

            .stats {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 750px) {

            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
                padding: 20px;
                padding-top: 80px;
            }

            .mobile-header {
                position: fixed;

                display: flex;

                align-items: center;
                justify-content: space-between;

                top: 0;
                left: 0;
                right: 0;

                height: 62px;

                padding: 0 18px;

                background: rgba(11,15,24,0.96);

                border-bottom:
                    1px solid var(--border);

                z-index: 200;
            }

            .mobile-brand {
                font-size: 18px;
                font-weight: 900;
            }

            .mobile-brand span {
                color: var(--blue-light);
            }

            .mobile-menu {
                border: 0;

                background: transparent;

                color: white;

                font-size: 22px;

                cursor: pointer;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .top-actions {
                width: 100%;
            }

            .top-button {
                flex: 1;
            }
        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .main {
                padding: 15px;
                padding-top: 78px;
            }

            .page-title h1 {
                font-size: 24px;
            }

            .stock-item {
                padding: 13px 15px;
            }

            .status {
                min-width: 65px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         MOBILE HEADER
    ========================= -->

    <header class="mobile-header">

        <div class="mobile-brand">
            Estoque<span>PRO</span>
        </div>

        <button
            class="mobile-menu"
            onclick="abrirMenuMobile()"
            aria-label="Abrir menu"
        >
            ☰
        </button>

    </header>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                E
            </div>

            <div class="brand-name">
                Estoque<span>PRO</span>
            </div>

        </div>


        <div class="menu-title">
            Principal
        </div>

        <nav class="menu">

            <button
                class="active"
                onclick="irPara('dashboard')"
            >
                <span class="menu-icon">▦</span>
                Dashboard
            </button>

            <button
                onclick="irPara('produtos')"
            >
                <span class="menu-icon">□</span>
                Produtos
            </button>

            <button
                onclick="irPara('movimentacoes')"
            >
                <span class="menu-icon">↕</span>
                Movimentações
            </button>

            <button
                onclick="irPara('relatorios')"
            >
                <span class="menu-icon">▤</span>
                Relatórios
            </button>

        </nav>


        <div class="menu-title" style="margin-top: 30px;">
            Conta
        </div>

        <nav class="menu">

            <button onclick="mostrarPerfil()">
                <span class="menu-icon">○</span>
                Meu perfil
            </button>

            <button onclick="mostrarPlanos()">
                <span class="menu-icon">★</span>
                EstoquePRO PRO
            </button>

        </nav>


        <div class="sidebar-bottom">

            <div class="user-mini">

                <div
                    class="avatar"
                    id="avatar"
                >
                    ?
                </div>

                <div class="user-info">

                    <strong id="nomeUsuario">
                        Usuário
                    </strong>

                    <span id="emailUsuario">
                        —
                    </span>

                </div>

                <button
                    class="logout"
                    onclick="sair()"
                    title="Sair"
                >
                    ↪
                </button>

            </div>

        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

        <div class="topbar">

            <div class="page-title">

                <h1>Dashboard</h1>

                <p id="mensagemBoasVindas">
                    Visão geral do seu estoque.
                </p>

            </div>

            <div class="top-actions">

                <button
                    class="top-button"
                    onclick="adicionarProduto()"
                >
                    + Produto
                </button>

                <button
                    class="top-button primary-button"
                    onclick="novaMovimentacao()"
                >
                    + Movimentação
                </button>

            </div>

        </div>


        <!-- =========================
             STATS
        ========================= -->

        <section class="stats">

            <div class="stat-card">

                <div class="stat-top">

                    <span class="stat-label">
                        Produtos
                    </span>

                    <div class="stat-icon">
                        📦
                    </div>

                </div>

                <div
                    class="stat-value"
                    id="totalProdutos"
                >
                    0
                </div>

                <div class="stat-extra">
                    produtos cadastrados
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-top">

                    <span class="stat-label">
                        Unidades em estoque
                    </span>

                    <div class="stat-icon">
                        ▣
                    </div>

                </div>

                <div
                    class="stat-value"
                    id="totalUnidades"
                >
                    0
                </div>

                <div class="stat-extra green">
                    quantidade disponível
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-top">

                    <span class="stat-label">
                        Valor do estoque
                    </span>

                    <div class="stat-icon">
                        $
                    </div>

                </div>

                <div
                    class="stat-value"
                    id="valorEstoque"
                >
                    R$ 0,00
                </div>

                <div class="stat-extra">
                    valor estimado
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-top">

                    <span class="stat-label">
                        Estoque baixo
                    </span>

                    <div class="stat-icon">
                        ⚠
                    </div>

                </div>

                <div
                    class="stat-value"
                    id="estoqueBaixo"
                >
                    0
                </div>

                <div class="stat-extra orange">
                    precisam de atenção
                </div>

            </div>

        </section>


        <!-- =========================
             CONTENT
        ========================= -->

        <section class="content-grid">


            <!-- PRODUTOS -->

            <div class="panel">

                <div class="panel-header">

                    <h2>
                        Estoque atual
                    </h2>

                    <button
                        onclick="verProdutos()"
                    >
                        Ver produtos
                    </button>

                </div>

                <div
                    class="stock-list"
                    id="stockList"
                >
                </div>

            </div>


            <!-- ATIVIDADES -->

            <div class="panel">

                <div class="panel-header">

                    <h2>
                        Atividade recente
                    </h2>

                    <button
                        onclick="verMovimentacoes()"
                    >
                        Ver tudo
                    </button>

                </div>

                <div
                    class="activity-list"
                    id="activityList"
                >
                </div>

            </div>

        </section>

    </main>


    <script>

        /* =========================
           PROTEÇÃO DA PÁGINA
        ========================= */

        const CHAVE_CONTA =
            "estoqueProConta";

        const CHAVE_LOGIN =
            "estoqueProLogado";

        const CHAVE_PRODUTOS =
            "estoqueProProdutos";

        const CHAVE_MOVIMENTACOES =
            "estoqueProMovimentacoes";


        if (
            localStorage.getItem(CHAVE_LOGIN) !== "true"
        ) {

            window.location.href = "index.html";

        }


        /* =========================
           CONTA
        ========================= */

        const contaSalva =
            localStorage.getItem(CHAVE_CONTA);

        let conta = null;

        if (contaSalva) {

            try {

                conta = JSON.parse(contaSalva);

            } catch (erro) {

                conta = null;

            }
        }


        function carregarUsuario() {

            if (!conta) {
                return;
            }

            const nome =
                conta.nome || "Usuário";

            const email =
                conta.email || "";

            document.getElementById(
                "nomeUsuario"
            ).textContent = nome;

            document.getElementById(
                "emailUsuario"
            ).textContent = email;

            document.getElementById(
                "mensagemBoasVindas"
            ).textContent =
                "Olá, " +
                nome.split(" ")[0] +
                "! Veja como está seu estoque.";

            const primeiraLetra =
                nome
                    .trim()
                    .charAt(0)
                    .toUpperCase();

            document.getElementById(
                "avatar"
            ).textContent =
                primeiraLetra || "?";
        }


        /* =========================
           DADOS
        ========================= */

        function obterProdutos() {

            const dados =
                localStorage.getItem(
                    CHAVE_PRODUTOS
                );

            if (!dados) {
                return [];
            }

            try {

                const produtos =
                    JSON.parse(dados);

                return Array.isArray(produtos)
                    ? produtos
                    : [];

            } catch (erro) {

                return [];

            }
        }


        function obterMovimentacoes() {

            const dados =
                localStorage.getItem(
                    CHAVE_MOVIMENTACOES
                );

            if (!dados) {
                return [];
            }

            try {

                const movimentacoes =
                    JSON.parse(dados);

                return Array.isArray(
                    movimentacoes
                )
                    ? movimentacoes
                    : [];

            } catch (erro) {

                return [];

            }
        }


        /* =========================
           DASHBOARD
        ========================= */

        function atualizarDashboard() {

            const produtos =
                obterProdutos();

            const movimentacoes =
                obterMovimentacoes();


            let totalUnidades = 0;
            let valorTotal = 0;
            let quantidadeBaixa = 0;


            produtos.forEach(produto => {

                const quantidade =
                    Number(produto.quantidade) || 0;

                const preco =
                    Number(produto.preco) || 0;

                const minimo =
                    Number(produto.minimo) || 0;

                totalUnidades += quantidade;

                valorTotal +=
                    quantidade * preco;

                if (
                    quantidade <= minimo
                ) {

                    quantidadeBaixa++;

                }

            });


            document.getElementById(
                "totalProdutos"
            ).textContent =
                produtos.length;


            document.getElementById(
                "totalUnidades"
            ).textContent =
                totalUnidades;


            document.getElementById(
                "valorEstoque"
            ).textContent =
                formatarMoeda(valorTotal);


            document.getElementById(
                "estoqueBaixo"
            ).textContent =
                quantidadeBaixa;


            renderizarProdutos(produtos);

            renderizarAtividades(
                movimentacoes
            );
        }


        /* =========================
           PRODUTOS
        ========================= */

        function renderizarProdutos(produtos) {

            const lista =
                document.getElementById(
                    "stockList"
                );

            if (!produtos.length) {

                lista.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">
                            📦
                        </div>

                        <p>
                            Nenhum produto cadastrado ainda.
                        </p>

                        <button
                            class="top-button primary-button"
                            style="margin-top:15px;"
                            onclick="adicionarProduto()"
                        >
                            Adicionar primeiro produto
                        </button>
                    </div>
                `;

                return;
            }


            const produtosOrdenados =
                [...produtos]
                    .sort(
                        (a, b) =>
                            Number(a.quantidade || 0) -
                            Number(b.quantidade || 0)
                    )
                    .slice(0, 6);


            lista.innerHTML =
                produtosOrdenados
                    .map(produto => {

                        const quantidade =
                            Number(
                                produto.quantidade
                            ) || 0;

                        const minimo =
                            Number(
                                produto.minimo
                            ) || 0;


                        let classe =
                            "ok";

                        let texto =
                            "Normal";


                        if (quantidade === 0) {

                            classe = "empty";
                            texto = "Esgotado";

                        } else if (
                            quantidade <= minimo
                        ) {

                            classe = "low";
                            texto = "Estoque baixo";

                        }


                        return `
                            <div class="stock-item">

                                <div class="product-icon">
                                    ${produto.icone || "📦"}
                                </div>

                                <div class="product-data">

                                    <strong>
                                        ${escaparHTML(
                                            produto.nome ||
                                            "Produto"
                                        )}
                                    </strong>

                                    <span>
                                        ${escaparHTML(
                                            produto.categoria ||
                                            "Sem categoria"
                                        )}
                                    </span>

                                </div>

                                <div class="quantity">
                                    ${quantidade}
                                </div>

                                <div class="status ${classe}">
                                    ${texto}
                                </div>

                            </div>
                        `;

                    })
                    .join("");
        }


        /* =========================
           ATIVIDADES
        ========================= */

        function renderizarAtividades(
            movimentacoes
        ) {

            const lista =
                document.getElementById(
                    "activityList"
                );


            if (!movimentacoes.length) {

                lista.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">
                            ↕
                        </div>

                        <p>
                            Nenhuma movimentação registrada.
                        </p>
                    </div>
                `;

                return;
            }


            const recentes =
                [...movimentacoes]
                    .sort(
                        (a, b) =>
                            Number(b.data) -
                            Number(a.data)
                    )
                    .slice(0, 6);


            lista.innerHTML =
                recentes
                    .map(mov => {

                        const entrada =
                            mov.tipo === "entrada";


                        return `
                            <div class="activity">

                                <div
                                    class="activity-dot ${
                                        entrada
                                            ? "green"
                                            : "orange"
                                    }"
                                ></div>

                                <div class="activity-text">

                                    <strong>
                                        ${entrada
                                            ? "Entrada"
                                            : "Saída"}
                                    </strong>

                                    de
                                    <strong>
                                        ${Number(
                                            mov.quantidade
                                        ) || 0}
                                    </strong>

                                    unidade(s) de

                                    <strong>
                                        ${escaparHTML(
                                            mov.produtoNome ||
                                            "produto"
                                        )}
                                    </strong>

                                    <span class="activity-time">
                                        ${formatarData(
                                            mov.data
                                        )}
                                    </span>

                                </div>

                            </div>
                        `;

                    })
                    .join("");
        }


        /* =========================
           BOTÕES
        ========================= */

        function adicionarProduto() {

            alert(
                "O cadastro de produtos será adicionado no próximo passo."
            );
        }


        function novaMovimentacao() {

            alert(
                "O sistema de movimentações será adicionado nos próximos passos."
            );
        }


        function verProdutos() {

            adicionarProduto();
        }


        function verMovimentacoes() {

            novaMovimentacao();
        }


        function irPara(pagina) {

            if (pagina === "dashboard") {

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

                return;
            }


            if (pagina === "produtos") {

                adicionarProduto();

                return;
            }


            if (pagina === "movimentacoes") {

                novaMovimentacao();

                return;
            }


            if (pagina === "relatorios") {

                alert(
                    "Os relatórios serão adicionados em uma próxima etapa."
                );

                return;
            }
        }


        function mostrarPerfil() {

            if (!conta) {
                return;
            }

            alert(
                "Perfil\n\n" +
                "Nome: " +
                conta.nome +
                "\n" +
                "E-mail: " +
                conta.email
            );
        }


        function mostrarPlanos() {

            alert(
                "EstoquePRO PRO\n\n" +
                "Em breve você poderá desbloquear recursos avançados."
            );
        }


        function abrirMenuMobile() {

            alert(
                "O menu mobile completo será conectado nos próximos passos."
            );
        }


        /* =========================
           LOGOUT
        ========================= */

        function sair() {

            const confirmar =
                confirm(
                    "Deseja realmente sair da sua conta?"
                );

            if (!confirmar) {
                return;
            }

            localStorage.removeItem(
                CHAVE_LOGIN
            );

            window.location.href =
                "index.html";
        }


        /* =========================
           UTILITÁRIOS
        ========================= */

        function formatarMoeda(valor) {

            return Number(valor || 0)
                .toLocaleString(
                    "pt-BR",
                    {
                        style: "currency",
                        currency: "BRL"
                    }
                );
        }


        function formatarData(data) {

            if (!data) {
                return "Data desconhecida";
            }

            const dataObj =
                new Date(Number(data));

            if (
                Number.isNaN(
                    dataObj.getTime()
                )
            ) {

                return "Data desconhecida";
            }


            return dataObj.toLocaleString(
                "pt-BR",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
        }


        function escaparHTML(texto) {

            return String(texto)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        /* =========================
           INICIALIZAÇÃO
        ========================= */

        carregarUsuario();

        atualizarDashboard();

    </script>
