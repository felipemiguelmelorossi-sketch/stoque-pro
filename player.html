<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>HBO FLIX - Player</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

header {
    height: 65px;

    display: flex;
    align-items: center;

    padding: 0 4%;

    background: #080808;
}

.logo {
    color: #e50914;
    font-size: 26px;
    font-weight: 900;
}

.back {
    margin-left: auto;

    color: white;

    cursor: pointer;

    padding: 10px 18px;

    background: #222;

    border-radius: 4px;
}

.back:hover {
    background: #333;
}

.player-container {
    width: 100%;
    max-width: 1200px;

    margin: 35px auto;

    padding: 0 20px;
}

video {
    width: 100%;

    max-height: 680px;

    display: block;

    background: #000;

    border-radius: 6px;
}

.title {
    font-size: 28px;

    font-weight: bold;

    margin-top: 25px;
}

.description {
    color: #aaa;

    line-height: 1.6;

    margin-top: 12px;
}

.message {
    padding: 50px 20px;

    text-align: center;

    color: #aaa;
}

.error {
    color: #ff5555;

    margin-top: 20px;

    text-align: center;
}

</style>

</head>

<body>

<header>

    <div class="logo">
        HBO FLIX
    </div>

    <div
        class="back"
        onclick="voltar()"
    >
        ← Voltar
    </div>

</header>


<div class="player-container">

    <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata"
    ></video>


    <div
        class="title"
        id="title"
    >
    </div>


    <div
        class="description"
        id="description"
    >
    </div>


    <div
        class="message"
        id="message"
        style="display:none"
    >
    </div>

</div>


<script>

/* ==================================
   CATÁLOGO
================================== */

const catalogo = [

    {
        id: 1,
        titulo: "Horizonte",
        descricao: "Um novo começo em um mundo desconhecido.",
        video: ""
    },

    {
        id: 2,
        titulo: "Código Zero",
        descricao: "Uma missão secreta muda tudo.",
        video: ""
    },

    {
        id: 3,
        titulo: "Além do Tempo",
        descricao: "Uma aventura através do tempo.",
        video: ""
    },

    {
        id: 4,
        titulo: "Distrito 9",
        descricao: "Uma cidade dividida por um segredo.",
        video: ""
    },

    {
        id: 5,
        titulo: "Última Chamada",
        descricao: "Uma ligação pode mudar o destino.",
        video: ""
    },

    {
        id: 6,
        titulo: "A Jornada",
        descricao: "Uma viagem inesperada.",
        video: ""
    },

    {
        id: 7,
        titulo: "Operação Eclipse",
        descricao: "Uma operação perigosa começa.",
        video: ""
    },

    {
        id: 8,
        titulo: "Cidade Sombria",
        descricao: "Mistérios escondidos nas ruas da cidade.",
        video: ""
    },

    {
        id: 9,
        titulo: "Depois da Meia-Noite",
        descricao: "Nada é o que parece.",
        video: ""
    },

    {
        id: 10,
        titulo: "O Último Sinal",
        descricao: "Um sinal misterioso chega do espaço.",
        video: ""
    },

    {
        id: 11,
        titulo: "Conexão",
        descricao: "Pessoas desconhecidas acabam conectadas.",
        video: ""
    },

    {
        id: 12,
        titulo: "Arquivo 21",
        descricao: "Um arquivo secreto guarda uma verdade.",
        video: ""
    },

    {
        id: 13,
        titulo: "Nova Geração",
        descricao: "Uma nova geração começa.",
        video: ""
    },

    {
        id: 14,
        titulo: "Linha Vermelha",
        descricao: "Cruzar a linha tem consequências.",
        video: ""
    },

    {
        id: 15,
        titulo: "Segredos",
        descricao: "Todos escondem alguma coisa.",
        video: ""
    },

    {
        id: 16,
        titulo: "Ponto Final",
        descricao: "Tudo termina em uma última decisão.",
        video: ""
    }

];


/* ==================================
   PEGAR ID DA URL
================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const id =
    Number(
        params.get("id")
    );


/* ==================================
   ENCONTRAR FILME
================================== */

const filme =
    catalogo.find(
        item => item.id === id
    );


const player =
    document.getElementById(
        "videoPlayer"
    );


const title =
    document.getElementById(
        "title"
    );


const description =
    document.getElementById(
        "description"
    );


const message =
    document.getElementById(
        "message"
    );


/* ==================================
   VERIFICAR FILME
================================== */

if (!filme) {

    player.style.display =
        "none";

    message.style.display =
        "block";

    message.textContent =
        "Título não encontrado.";

} else {

    title.textContent =
        filme.titulo;

    description.textContent =
        filme.descricao;


    if (!filme.video) {

        player.style.display =
            "none";

        message.style.display =
            "block";

        message.textContent =
            "Este título ainda não possui um vídeo conectado.";

    } else {

        player.src =
            filme.video;

    }

}


/* ==================================
   VOLTAR
================================== */

function voltar() {

    window.location.href =
        "home.html";

}

</script>

</body>

</html>
