<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Loja — EstoquePRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#07111f;
color:white;
min-height:100vh;
}

.header{
padding:40px 20px;
background:#0ea5e9;
}

.headerInner{
max-width:1100px;
margin:auto;
}

.logo{
width:85px;
height:85px;
object-fit:cover;
border-radius:15px;
margin-bottom:15px;
background:#17263a;
}

.header h1{
font-size:34px;
margin-bottom:8px;
}

.header p{
color:#e0f2fe;
}

.container{
max-width:1100px;
margin:auto;
padding:35px 20px;
}

.products{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(220px,1fr));
gap:20px;
margin-top:25px;
}

.product{
background:#0d1b2d;
border:1px solid #1d2b40;
border-radius:15px;
padding:20px;
}

.category{
font-size:13px;
color:#38bdf8;
margin-bottom:10px;
}

.product h3{
margin-bottom:12px;
}

.price{
font-size:23px;
font-weight:bold;
margin-bottom:10px;
}

.stock{
color:#94a3b8;
}

.empty{
padding:50px 20px;
text-align:center;
background:#0d1b2d;
border:1px solid #1d2b40;
border-radius:15px;
color:#94a3b8;
}

.footer{
text-align:center;
padding:40px;
color:#64748b;
}

</style>

</head>

<body>

<header class="header" id="header">

<div class="headerInner">

<img
id="logo"
class="logo"
style="display:none;">

<h1 id="nome">
Carregando...
</h1>

<p id="descricao">
Carregando loja...
</p>

</div>

</header>


<main class="container">

<h2>
📦 Produtos
</h2>

<div
id="produtos"
class="products">

</div>

</main>


<footer class="footer">

EstoquePRO

</footer>


<script>

async function carregar(){

const params=
new URLSearchParams(
location.search
);

const slug=params.get("loja");

if(!slug){

mostrarErro("Loja não encontrada.");
return;

}

const {data:loja,error}=await supabaseClient
.from("lojas")
.select("*")
.eq("slug",slug)
.single();

if(error || !loja){

mostrarErro("Essa loja não existe.");
return;

}

document.title=loja.nome+" — EstoquePRO";

document.getElementById("nome").textContent=
loja.nome;

document.getElementById("descricao").textContent=
loja.descricao||
"Bem-vindo à nossa loja.";

document.getElementById("header").style.background=
loja.cor||
"#0ea5e9";

if(loja.logo){

const logo=document.getElementById("logo");

logo.src=loja.logo;

logo.style.display="block";

}

const {data:produtos}=await supabaseClient
.from("produtos")
.select("*")
.eq("usuario_id",loja.usuario_id)
.gt("quantidade",0)
.order("criado_em",{ascending:false});

const container=
document.getElementById("produtos");

if(!produtos || produtos.length===0){

container.innerHTML=`

<div class="empty">

<h2>
📦 Nenhum produto disponível
</h2>

<p style="margin-top:10px;">
Esta loja ainda não possui produtos.
</p>

</div>

`;

return;

}

produtos.forEach(produto=>{

const card=document.createElement("div");

card.className="product";

card.innerHTML=`

<div class="category">
${escapeHTML(produto.categoria||"Produto")}
</div>

<h3>
${escapeHTML(produto.nome)}
</h3>

<div class="price">
R$ ${Number(produto.preco||0)
.toFixed(2)
.replace(".",",")}
</div>

<div class="stock">
Em estoque: ${produto.quantidade}
</div>

`;

container.appendChild(card);

});

}

function mostrarErro(texto){

document.getElementById("nome").textContent=
"Loja não encontrada";

document.getElementById("descricao").textContent=
texto;

document.getElementById("produtos").innerHTML=`

<div class="empty">

<h2>😕 Ops!</h2>

<p style="margin-top:10px;">
${texto}
</p>

</div>

`;

}

function escapeHTML(text){

const div=document.createElement("div");

div.textContent=text;

return div.innerHTML;

}

carregar();

</script>

</body>
</html>
